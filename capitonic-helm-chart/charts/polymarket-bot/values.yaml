image: capitonic/polymarket-bot:v3.3.0-local.4
environment: development
imagePullPolicy: Never
imagePullSecrets: []
apiIngress:
  enabled: true
  host: localhost
  clusterIssuer: letsencrypt-production
  tls:
    enabled: false
    secretName: grafana-tls
replicaCount: 1
resources:
  requests: {cpu: 100m, memory: 256Mi}
  limits: {cpu: 2000m, memory: 512Mi}
externalSecrets:
  enabled: false
credentialRevisions: {}
openaiAgent:
  enabled: true
  secretName: polymarket-openai-auth
  storageSize: 64Mi
  storageClass: local-path
