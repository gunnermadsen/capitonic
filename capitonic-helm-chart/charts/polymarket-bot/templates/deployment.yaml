apiVersion: apps/v1
kind: Deployment
metadata:
  name: polymarket-bot
  labels:
    app.kubernetes.io/name: polymarket-bot
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: trading
    app.kubernetes.io/part-of: capitonic-platform
    app.kubernetes.io/managed-by: Helm
    capitonic.io/environment: {{ $.Values.environment | quote }}
    capitonic.io/rollout-domain: trading
spec:
  replicas: {{ .Values.replicaCount }}
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/name: polymarket-bot
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
{{- with index .Values.credentialRevisions "polymarket-bot" }}
      annotations:
        capitonic.io/credential-revision: {{ . | quote }}
{{- end }}
      labels:
        app.kubernetes.io/name: polymarket-bot
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: trading
        app.kubernetes.io/part-of: capitonic-platform
        capitonic.io/environment: {{ $.Values.environment | quote }}
        capitonic.io/rollout-domain: trading
    spec:
      imagePullSecrets: {{ toJson .Values.imagePullSecrets }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
{{- if .Values.openaiAgent.enabled }}
        fsGroup: 10002
{{- end }}
      containers:
        - name: polymarket-bot
          image: {{ include "polymarket-bot.image" . | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - {name: http, containerPort: 8097}
          env:
{{- if .Values.openaiAgent.enabled }}
            - {name: POLYMARKET_OPENAI_CREDENTIAL_PATH, value: /var/lib/polymarket/openai/credentials.enc}
            - {name: POLYMARKET_OPENAI_CREDENTIAL_KEY, valueFrom: {secretKeyRef: {name: {{ .Values.openaiAgent.secretName }}, key: POLYMARKET_OPENAI_CREDENTIAL_KEY}}}
{{- end }}
            - {name: RUST_LOG, value: info}
            - {name: TOKIO_WORKER_THREADS, value: "2"}
            - {name: POSTGRES_HOST, value: pgbouncer}
            - {name: POSTGRES_PORT, value: "6432"}
            - {name: POSTGRES_USER, value: capitonic_trading}
            - {name: POSTGRES_DB, value: polymarket_trading}
            - {name: POSTGRES_SSL_MODE, value: disable}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: postgres-credentials, key: CAPITONIC_TRADING_POSTGRES_PASSWORD}}}
            - {name: INGESTER_MASTER_URL, value: "http://ingester-master:8098"}
            - {name: INGESTER_ADMIN_TOKEN, valueFrom: {secretKeyRef: {name: ingester-auth, key: admin-token}}}
            - {name: POLYMARKET_BTC_MODEL_DIR, value: /usr/local/share/polymarket-bot/models}
            - {name: POLYMARKET_GRAFANA_LIVE_ENABLED, value: "true"}
            - {name: POLYMARKET_GRAFANA_LIVE_PUSH_URL, value: "http://grafana:3000/api/live/push/polymarket"}
            - {name: POLYMARKET_GRAFANA_LIVE_USERNAME, valueFrom: {secretKeyRef: {name: grafana-auth, key: admin-user}}}
            - {name: POLYMARKET_GRAFANA_LIVE_PASSWORD, valueFrom: {secretKeyRef: {name: grafana-auth, key: admin-password}}}
            - {name: POLYMARKET_HTTP_ENABLED, value: "true"}
            - {name: POLYMARKET_HTTP_BIND, value: "0.0.0.0:8097"}
            - {name: POLYMARKET_HTTP_ADMIN_TOKEN, valueFrom: {secretKeyRef: {name: polymarket-bot-auth, key: admin-token}}}
            - {name: POLYMARKET_CLOB_API_KEY, valueFrom: {secretKeyRef: {name: polymarket-live-auth, key: POLYMARKET_CLOB_API_KEY}}}
            - {name: POLYMARKET_CLOB_SECRET, valueFrom: {secretKeyRef: {name: polymarket-live-auth, key: POLYMARKET_CLOB_SECRET}}}
            - {name: POLYMARKET_CLOB_PASSPHRASE, valueFrom: {secretKeyRef: {name: polymarket-live-auth, key: POLYMARKET_CLOB_PASSPHRASE}}}
            - {name: POLYMARKET_PRIVATE_KEY, valueFrom: {secretKeyRef: {name: polymarket-live-auth, key: POLYMARKET_PRIVATE_KEY}}}
            - {name: POLYMARKET_FUNDER_ADDRESS, valueFrom: {secretKeyRef: {name: polymarket-live-auth, key: POLYMARKET_FUNDER_ADDRESS}}}
            - {name: POLYMARKET_SIGNATURE_TYPE, valueFrom: {secretKeyRef: {name: polymarket-live-auth, key: POLYMARKET_SIGNATURE_TYPE}}}
          startupProbe:
            httpGet: {path: /health/live, port: http}
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
{{ toYaml .Values.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
{{- if .Values.openaiAgent.enabled }}
          volumeMounts:
            - {name: openai-credentials, mountPath: /var/lib/polymarket/openai}
      volumes:
        - name: openai-credentials
          persistentVolumeClaim: {claimName: polymarket-openai-credentials}
{{- end }}
