{{- if .Values.apiIngress.enabled }}
{{- if ne .Values.environment "production" }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: polymarket-bot-strip-api-bot
  labels:
    app.kubernetes.io/name: polymarket-bot
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: capitonic-platform
    app.kubernetes.io/managed-by: Helm
    capitonic.io/environment: {{ $.Values.environment | quote }}
spec:
  stripPrefix:
    prefixes: [/api/bot]
---
{{- end }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: polymarket-bot
  annotations:
{{- if eq .Values.environment "production" }}
    cert-manager.io/cluster-issuer: {{ .Values.apiIngress.clusterIssuer | quote }}
{{- else }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-polymarket-bot-strip-api-bot@kubernetescrd
{{- end }}
{{- if .Values.apiIngress.tls.enabled }}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
{{- end }}
  labels:
    app.kubernetes.io/name: polymarket-bot
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: capitonic-platform
    app.kubernetes.io/managed-by: Helm
    capitonic.io/environment: {{ $.Values.environment | quote }}
spec:
  ingressClassName: traefik
{{- if .Values.apiIngress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.apiIngress.host | quote }}]
      secretName: {{ .Values.apiIngress.tls.secretName | quote }}
{{- end }}
  rules:
    - host: {{ .Values.apiIngress.host | quote }}
      http:
        paths:
          - path: {{ if eq .Values.environment "production" }}/admin{{ else }}/api/bot{{ end }}
            pathType: Prefix
            backend:
              service:
                name: polymarket-bot
                port: {name: http}
{{- end }}
