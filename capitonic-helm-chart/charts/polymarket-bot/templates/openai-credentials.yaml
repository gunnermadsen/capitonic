{{- if .Values.openaiAgent.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: polymarket-openai-credentials
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.openaiAgent.storageClass | quote }}
  resources:
    requests:
      storage: {{ .Values.openaiAgent.storageSize | quote }}
{{- end }}
