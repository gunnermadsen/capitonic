{{- $name := include "db-migrate.workloadName" . -}}
{{- if ne .Release.Name $name -}}
{{- fail (printf "Helm release name must be %q" $name) -}}
{{- end -}}
{{- if hasKey .Values "jobName" -}}
{{- fail "jobName is no longer configurable; remove the override" -}}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: migration
    app.kubernetes.io/part-of: capitonic-platform
    app.kubernetes.io/managed-by: Helm
    capitonic.io/environment: {{ $.Values.environment | quote }}
    capitonic.io/rollout-domain: database
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 900
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: migration
        app.kubernetes.io/part-of: capitonic-platform
        capitonic.io/environment: {{ $.Values.environment | quote }}
        capitonic.io/rollout-domain: database
    spec:
      imagePullSecrets: {{ toJson .Values.imagePullSecrets }}
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: {{ $name }}
          image: {{ include "db-migrate.image" . | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
{{- with .Values.command }}
          command: {{ toJson . }}
{{- end }}
          env:
            - {name: POSTGRES_HOST, value: {{ .Values.postgresHost | quote }}}
            - {name: POSTGRES_PORT, value: "5432"}
            - {name: POSTGRES_USER, value: postgres}
            - {name: POSTGRES_DB, value: polymarket}
            - {name: POSTGRES_SSL_MODE, value: disable}
            - {name: NODE_ENV, value: production}
{{- if .Values.migrationsPattern }}
            - {name: DB_MIGRATIONS_PATTERN, value: {{ .Values.migrationsPattern | quote }}}
{{- end }}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: postgres-credentials, key: POSTGRES_PASSWORD}}}
            - {name: CAPITONIC_TRADING_POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: postgres-credentials, key: CAPITONIC_TRADING_POSTGRES_PASSWORD}}}
            - {name: CAPITONIC_INGESTER_MASTER_POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: postgres-credentials, key: CAPITONIC_INGESTER_MASTER_POSTGRES_PASSWORD}}}
            - {name: CAPITONIC_INGESTER_WORKER_POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: postgres-credentials, key: CAPITONIC_INGESTER_WORKER_POSTGRES_PASSWORD}}}
            - {name: CAPITONIC_GRAFANA_POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: postgres-credentials, key: CAPITONIC_GRAFANA_POSTGRES_PASSWORD}}}
          resources:
{{ toYaml .Values.resources | indent 12 }}
