apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-config
  labels:
    app.kubernetes.io/name: pgbouncer
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: capitonic-platform
    app.kubernetes.io/managed-by: Helm
    capitonic.io/environment: dev
    capitonic.io/rollout-domain: database
data:
  pgbouncer.ini: |-
{{ required "run scripts/helm/bake-assets.py before Helm: missing PgBouncer config" (.Files.Get "assets/pgbouncer.ini") | nindent 4 }}
  pgbouncer-entrypoint.sh: |-
{{ required "run scripts/helm/bake-assets.py before Helm: missing PgBouncer startup script" (.Files.Get "assets/pgbouncer-entrypoint.sh") | indent 4 }}
