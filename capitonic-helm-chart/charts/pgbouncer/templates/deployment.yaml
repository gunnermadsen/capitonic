apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgbouncer
  labels:
    app.kubernetes.io/name: pgbouncer
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: capitonic-platform
    app.kubernetes.io/managed-by: Helm
    capitonic.io/environment: dev
    capitonic.io/rollout-domain: database
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/name: pgbouncer
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pgbouncer
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: capitonic-platform
        capitonic.io/environment: dev
        capitonic.io/rollout-domain: database
      annotations:
        checksum/config: {{ (.Files.Glob "assets/*").AsConfig | sha256sum }}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: pgbouncer
          image: {{ .Values.image | quote }}
          imagePullPolicy: Never
          command: [/usr/local/bin/capitonic-pgbouncer-entrypoint.sh]
          args: [/usr/bin/pgbouncer, /etc/pgbouncer/pgbouncer.ini]
          ports:
            - {name: pgbouncer, containerPort: 6432}
          env:
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: postgres-credentials, key: POSTGRES_PASSWORD}}}
            - {name: CAPITONIC_TRADING_POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: postgres-credentials, key: CAPITONIC_TRADING_POSTGRES_PASSWORD}}}
            - {name: CAPITONIC_INGESTER_MASTER_POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: postgres-credentials, key: CAPITONIC_INGESTER_MASTER_POSTGRES_PASSWORD}}}
            - {name: CAPITONIC_INGESTER_WORKER_POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: postgres-credentials, key: CAPITONIC_INGESTER_WORKER_POSTGRES_PASSWORD}}}
            - {name: CAPITONIC_GRAFANA_POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: postgres-credentials, key: CAPITONIC_GRAFANA_POSTGRES_PASSWORD}}}
          startupProbe:
            exec: {command: [pg_isready, -h, 127.0.0.1, -p, "6432", -U, postgres, -d, polymarket]}
            failureThreshold: 20
            periodSeconds: 5
          readinessProbe:
            exec: {command: [pg_isready, -h, 127.0.0.1, -p, "6432", -U, postgres, -d, polymarket]}
            periodSeconds: 10
          livenessProbe:
            exec: {command: [pg_isready, -h, 127.0.0.1, -p, "6432", -U, postgres, -d, polymarket]}
            periodSeconds: 30
          resources:
{{ toYaml .Values.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: config, mountPath: /etc/pgbouncer/pgbouncer.ini, subPath: pgbouncer.ini, readOnly: true}
            - {name: config, mountPath: /usr/local/bin/capitonic-pgbouncer-entrypoint.sh, subPath: pgbouncer-entrypoint.sh, readOnly: true}
            - {name: tmp, mountPath: /tmp}
        - name: pgbouncer-exporter
          image: {{ .Values.metricsImage | quote }}
          imagePullPolicy: Never
          ports:
            - {name: metrics, containerPort: 9127}
          env:
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: postgres-credentials, key: POSTGRES_PASSWORD}}}
            - {name: PGBOUNCER_EXPORTER_CONNECTION_STRING, value: "postgres://postgres:$(POSTGRES_PASSWORD)@127.0.0.1:6432/pgbouncer?sslmode=disable"}
          readinessProbe:
            httpGet: {path: /metrics, port: metrics}
            periodSeconds: 10
          resources:
{{ toYaml .Values.metricsResources | indent 12 }}
      volumes:
        - name: config
          configMap: {name: pgbouncer-config, defaultMode: 0555}
        - name: tmp
          emptyDir: {sizeLimit: 8Mi}
