apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: capitonic-platform
    app.kubernetes.io/managed-by: Helm
    capitonic.io/environment: dev
    capitonic.io/rollout-domain: monitoring
data:
  prometheus.yml: |-
{{ required "run scripts/helm/bake-assets.py before Helm: missing Prometheus config" (.Files.Get "assets/prometheus.yml") | nindent 4 }}
