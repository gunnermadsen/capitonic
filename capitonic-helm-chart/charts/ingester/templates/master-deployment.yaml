apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingester-master
  labels:
    app.kubernetes.io/name: ingester-master
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: capitonic-platform
    app.kubernetes.io/managed-by: Helm
    capitonic.io/environment: dev
    capitonic.io/rollout-domain: ingestion
spec:
  replicas: {{ .Values.master.replicaCount }}
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/name: ingester-master
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ingester-master
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: ingestion
        app.kubernetes.io/part-of: capitonic-platform
        capitonic.io/environment: dev
        capitonic.io/rollout-domain: ingestion
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10003
      containers:
        - name: ingester-master
          image: {{ .Values.image | quote }}
          imagePullPolicy: Never
          ports:
            - {name: http, containerPort: 8098}
          env:
{{ include "ingester.commonEnv" . | indent 12 }}
            - {name: POSTGRES_USER, value: capitonic_ingester_master}
            - {name: POSTGRES_DB, value: polymarket_ingester_master_tx}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: postgres-credentials, key: CAPITONIC_INGESTER_MASTER_POSTGRES_PASSWORD}}}
            - {name: INGESTER_MODE, value: master}
            - {name: INGESTER_INSTANCE, value: ingester-master}
            - {name: INGESTER_API_BIND, value: "0.0.0.0:8098"}
          startupProbe:
            httpGet: {path: /health/live, port: http}
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
{{ toYaml .Values.master.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
