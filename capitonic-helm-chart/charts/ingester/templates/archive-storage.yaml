apiVersion: v1
kind: PersistentVolume
metadata:
  name: capitonic-ingester-archives
  labels:
    app.kubernetes.io/name: ingester-worker
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: capitonic-platform
    app.kubernetes.io/managed-by: Helm
    capitonic.io/environment: {{ $.Values.environment | quote }}
spec:
  capacity:
    storage: {{ .Values.archiveStorage.size | quote }}
  volumeMode: Filesystem
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
{{- if eq .Values.archiveStorage.type "hostPath" }}
  hostPath:
    path: {{ .Values.archiveStorage.path | quote }}
    type: DirectoryOrCreate
{{- else }}
  local:
    path: {{ .Values.archiveStorage.path | quote }}
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values: [{{ .Values.archiveStorage.nodeName | quote }}]
{{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ingester-archives
  labels:
    app.kubernetes.io/name: ingester-worker
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: capitonic-platform
    app.kubernetes.io/managed-by: Helm
    capitonic.io/environment: {{ $.Values.environment | quote }}
spec:
  accessModes: [ReadWriteOnce]
  volumeMode: Filesystem
  storageClassName: ""
  volumeName: capitonic-ingester-archives
  resources:
    requests:
      storage: {{ .Values.archiveStorage.size | quote }}
