{{- if .Values.apiIngress.enabled }}
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ingester-strip-api-ingester
  labels:
    app.kubernetes.io/name: ingester-master
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: capitonic-platform
    app.kubernetes.io/managed-by: Helm
    capitonic.io/environment: {{ $.Values.environment | quote }}
spec:
  stripPrefix:
    prefixes: [/api/ingester]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingester-master
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: {{ .Release.Namespace }}-ingester-strip-api-ingester@kubernetescrd
{{- if .Values.apiIngress.tls.enabled }}
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
{{- else }}
    traefik.ingress.kubernetes.io/router.entrypoints: web
{{- end }}
  labels:
    app.kubernetes.io/name: ingester-master
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: capitonic-platform
    app.kubernetes.io/managed-by: Helm
    capitonic.io/environment: {{ $.Values.environment | quote }}
spec:
  ingressClassName: traefik
{{- if .Values.apiIngress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.apiIngress.host | quote }}]
      secretName: {{ .Values.apiIngress.tls.secretName | quote }}
{{- end }}
  rules:
    - host: {{ .Values.apiIngress.host | quote }}
      http:
        paths:
          - path: /api/ingester
            pathType: Prefix
            backend:
              service:
                name: ingester-master
                port: {name: http}
{{- end }}
