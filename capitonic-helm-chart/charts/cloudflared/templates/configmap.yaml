apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudflared
  labels:
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: capitonic-platform
    capitonic.io/environment: {{ .Values.environment | quote }}
data:
  config.yml: |-
    tunnel: {{ required "cloudflared tunnelId is required" .Values.tunnelId | quote }}
    credentials-file: /etc/cloudflared-credentials/credentials.json
    ingress:
      - hostname: {{ required "cloudflared sshHostname is required" .Values.sshHostname | quote }}
        service: ssh://127.0.0.1:22
{{- if .Values.opsHostname }}
      - hostname: {{ .Values.opsHostname | quote }}
        service: http://traefik.kube-system.svc.cluster.local:80
{{- end }}
      - service: http_status:404
