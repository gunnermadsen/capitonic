apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  labels:
    app.kubernetes.io/name: cloudflared
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: capitonic-platform
    capitonic.io/environment: {{ .Values.environment | quote }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy: {type: RollingUpdate}
  selector:
    matchLabels:
      app.kubernetes.io/name: cloudflared
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cloudflared
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: capitonic-platform
        capitonic.io/environment: {{ .Values.environment | quote }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      imagePullSecrets: {{ toJson .Values.imagePullSecrets }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: cloudflared
          image: {{ .Values.image | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args: [tunnel, --no-autoupdate, --protocol, http2, --metrics, 0.0.0.0:2000, --config, /etc/cloudflared/config.yml, run]
          ports:
            - {name: metrics, containerPort: 2000}
          readinessProbe:
            httpGet: {path: /ready, port: 2000}
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /ready, port: 2000}
            initialDelaySeconds: 15
            periodSeconds: 30
          resources:
{{ toYaml .Values.resources | indent 12 }}
          volumeMounts:
            - {name: config, mountPath: /etc/cloudflared, readOnly: true}
            - {name: credentials, mountPath: /etc/cloudflared-credentials, readOnly: true}
      volumes:
        - name: config
          configMap: {name: cloudflared}
        - name: credentials
          secret: {secretName: cloudflare-tunnel}
