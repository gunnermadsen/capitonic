apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: capitonic-platform
    app.kubernetes.io/managed-by: Helm
    capitonic.io/environment: {{ $.Values.environment | quote }}
    capitonic.io/rollout-domain: monitoring
data:
  dashboards.yml: |-
{{ required "run scripts/helm/bake-assets.py before Helm: missing Grafana dashboard provisioning" (.Files.Get "assets/provisioning/dashboards/dashboards.yml") | nindent 4 }}
  datasources.yml: |-
{{ required "run scripts/helm/bake-assets.py before Helm: missing Grafana datasources" (.Files.Get "assets/provisioning/datasources/datasources.yml") | nindent 4 }}
{{- if eq (len (.Files.Glob "assets/provisioning/alerting/*.yml")) 0 }}
{{- fail "run scripts/helm/bake-assets.py before Helm: missing Grafana alert rules" }}
{{- end }}
{{- range $path, $_ := .Files.Glob "assets/provisioning/alerting/*.yml" }}
  {{ base $path }}: |-
{{ $.Files.Get $path | nindent 4 }}
{{- end }}
{{- if eq (len (.Files.Glob "assets/dashboards/*.json")) 0 }}
{{- fail "run scripts/helm/bake-assets.py before Helm: missing Grafana dashboards" }}
{{- end }}
{{- range $path, $_ := .Files.Glob "assets/dashboards/*.json" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-{{ base $path | trimSuffix ".json" }}
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/part-of: capitonic-platform
    app.kubernetes.io/managed-by: Helm
    capitonic.io/environment: {{ $.Values.environment | quote }}
    capitonic.io/rollout-domain: monitoring
data:
  {{ base $path }}: |-
{{ $.Files.Get $path | nindent 4 }}
{{- end }}
