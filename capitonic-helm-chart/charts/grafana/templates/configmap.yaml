apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: capitonic-platform
    app.kubernetes.io/managed-by: Helm
    capitonic.io/environment: dev
    capitonic.io/rollout-domain: monitoring
data:
  dashboards.yml: |-
{{ .Files.Get "assets/provisioning/dashboards/dashboards.yml" | nindent 4 }}
  datasources.yml: |-
{{ .Files.Get "assets/provisioning/datasources/datasources.yml" | nindent 4 }}
  rules-prometheus.yml: |-
{{ .Files.Get "assets/provisioning/alerting/rules-prometheus.yml" | nindent 4 }}
{{- range $path, $_ := .Files.Glob "assets/dashboards/*.json" }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-{{ base $path | trimSuffix ".json" }}
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/part-of: capitonic-platform
    app.kubernetes.io/managed-by: Helm
    capitonic.io/environment: dev
    capitonic.io/rollout-domain: monitoring
data:
  {{ base $path }}: |-
{{ $.Files.Get $path | nindent 4 }}
{{- end }}
