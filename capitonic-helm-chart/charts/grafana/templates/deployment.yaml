apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: capitonic-platform
    app.kubernetes.io/managed-by: Helm
    capitonic.io/environment: dev
    capitonic.io/rollout-domain: monitoring
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: monitoring
        app.kubernetes.io/part-of: capitonic-platform
        capitonic.io/environment: dev
        capitonic.io/rollout-domain: monitoring
      annotations:
        checksum/provisioning: {{ (.Files.Glob "assets/**").AsConfig | sha256sum }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
      containers:
        - name: grafana
          image: {{ .Values.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - {name: GF_USERS_DEFAULT_THEME, value: dark}
            - {name: PROMETHEUS_ENVIRONMENT, value: dev}
            - {name: GF_SECURITY_ADMIN_USER, valueFrom: {secretKeyRef: {name: grafana-auth, key: admin-user}}}
            - {name: GF_SECURITY_ADMIN_PASSWORD, valueFrom: {secretKeyRef: {name: grafana-auth, key: admin-password}}}
            - {name: PROMETHEUS_BASIC_AUTH_USER, valueFrom: {secretKeyRef: {name: prometheus-auth, key: username}}}
            - {name: PROMETHEUS_BASIC_AUTH_PASSWORD, valueFrom: {secretKeyRef: {name: prometheus-auth, key: password}}}
            - {name: GRAFANA_POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: postgres-credentials, key: CAPITONIC_GRAFANA_POSTGRES_PASSWORD}}}
          startupProbe:
            httpGet: {path: /api/health, port: http}
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 30
          resources:
{{ toYaml .Values.resources | indent 12 }}
          volumeMounts:
            - {name: data, mountPath: /var/lib/grafana}
            - {name: provisioning, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yml, subPath: dashboards.yml, readOnly: true}
            - {name: provisioning, mountPath: /etc/grafana/provisioning/datasources/datasources.yml, subPath: datasources.yml, readOnly: true}
            - {name: provisioning, mountPath: /etc/grafana/provisioning/alerting/rules-prometheus.yml, subPath: rules-prometheus.yml, readOnly: true}
            - {name: provisioning, mountPath: /etc/grafana/provisioning/alerting/rules-polymarket-bot.yml, subPath: rules-polymarket-bot.yml, readOnly: true}
{{- range $path, $_ := .Files.Glob "assets/dashboards/*.json" }}
            - {name: dashboard-{{ base $path | trimSuffix ".json" }}, mountPath: /etc/grafana/dashboards/polymarket-bot/{{ base $path }}, subPath: {{ base $path }}, readOnly: true}
{{- end }}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: grafana-data}
        - name: provisioning
          configMap: {name: grafana-provisioning}
{{- range $path, $_ := .Files.Glob "assets/dashboards/*.json" }}
        - name: dashboard-{{ base $path | trimSuffix ".json" }}
          configMap: {name: grafana-dashboard-{{ base $path | trimSuffix ".json" }}}
{{- end }}
