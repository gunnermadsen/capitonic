apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: {{ .Values.issuerName | quote }}
  labels:
    app.kubernetes.io/part-of: capitonic-platform
    capitonic.io/environment: {{ .Values.environment | quote }}
spec:
  acme:
    email: {{ required "ACME email is required" .Values.email | quote }}
    server: {{ .Values.server | quote }}
    privateKeySecretRef:
      name: {{ printf "%s-account-key" .Values.issuerName | quote }}
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-dns
              key: api-token
