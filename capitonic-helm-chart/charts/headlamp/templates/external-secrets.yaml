{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Release.Name }}-aws
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.externalSecrets.region | quote }}
{{- range .Values.externalSecrets.entries }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
    capitonic.io/refresh-after: {{ required "select an immutable AWS secret version before deployment" .refreshAfter | quote }}
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    name: {{ $.Release.Name }}-aws
    kind: SecretStore
  target:
    name: {{ .name }}
    creationPolicy: Orphan
    deletionPolicy: Retain
    template:
      engineVersion: v2
      mergePolicy: Replace
      metadata:
        annotations:
          argocd.argoproj.io/compare-options: IgnoreExtraneous
          argocd.argoproj.io/sync-options: Prune=false
      data:
        users: {{ "{{ htpasswd .HEADLAMP_USERNAME .HEADLAMP_PASSWORD \"bcrypt\" }}" | quote }}
  data:
{{- $entry := . }}
{{- range $key, $property := .properties }}
    - secretKey: {{ $key | quote }}
      remoteRef:
        key: {{ $.Values.externalSecrets.secretId | quote }}
        version: {{ printf "uuid/%s" (required "immutable AWS version required" $entry.version) | quote }}
        property: {{ $property | quote }}
{{- end }}
{{- end }}
{{- end }}
