upstream:
  fullnameOverride: headlamp
  replicaCount: 1
  image:
    tag: "v0.45.0"
  config:
    baseURL: /system
    inClusterContextName: rancher-desktop
    # The password middleware and backend NetworkPolicy must remain enabled.
    unsafeUseServiceAccountToken: true
    oidc:
      secret:
        create: false
  clusterRoleBinding:
    create: false
  serviceAccount:
    name: headlamp-viewer
    create: false
  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: web
      traefik.ingress.kubernetes.io/router.middlewares: capitonic-headlamp-basic-auth@kubernetescrd
    hosts:
      - host: localhost
        paths:
          - path: /system
            type: Prefix
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {cpu: 250m, memory: 256Mi}

viewer:
  serviceAccountName: headlamp-viewer

# Populated by scripts/helm/provision-headlamp.py from the main .env.headlamp.
# HEADLAMP_PASSWORD is never passed to Helm; only its derived bcrypt hash is used.
credentials:
  HEADLAMP_USERNAME: ""
  HEADLAMP_PASSWORD_HASH: ""
