name: Verify Production Trading Processes

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: capitonic-production
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  AWS_ROLE_ARN: arn:aws:iam::192200846560:role/capitonic-polymarket-bot-github-actions-prod

jobs:
  pilots:
    name: Verify production trading processes
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Resolve production revision and host
        id: target
        run: |
          set -euo pipefail
          revision="$(git ls-remote origin refs/heads/production | cut -f1)"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          instance_id="$(aws ec2 describe-instances --region "$AWS_REGION" \
            --filters Name=tag:Name,Values=capitonic-polymarket-bot Name=tag:Environment,Values=production Name=instance-state-name,Values=running \
            --query 'Reservations[].Instances[].InstanceId' --output text)"
          [ "$(wc -w <<< "$instance_id")" -eq 1 ]
          printf 'revision=%s\ninstance_id=%s\n' "$revision" "$instance_id" >> "$GITHUB_OUTPUT"
      - name: Verify production trading processes
        env:
          INSTANCE_ID: ${{ steps.target.outputs.instance_id }}
          REVISION: ${{ steps.target.outputs.revision }}
        run: |
          command="cd /opt/polymarket-bot && scripts/production/checkout-revision.sh $REVISION && scripts/production/verify-production.sh"
          scripts/production/run-ssm-command.sh "$INSTANCE_ID" 1800 'Verify production trading processes' "$command"
