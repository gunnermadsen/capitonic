name: Verify and Publish Images

on:
  push:
    branches:
      - development
      - feature/**
      - defect/**
      - fix/**

permissions:
  contents: read
  id-token: write

concurrency:
  group: capitonic-ci
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.92.0
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-1' }}
  AWS_ROLE_ARN: arn:aws:iam::192200846560:role/capitonic-polymarket-bot-github-actions-prod
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY || '192200846560.dkr.ecr.eu-west-1.amazonaws.com' }}

jobs:
  repository-layout:
    name: Repository layout
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Reject vendored Rust crates
        shell: bash
        run: |
          if [ -e vendor ]; then
            echo "Root-level vendor/ is prohibited; declare Rust dependencies in Cargo.toml." >&2
            exit 1
          fi

  changes:
    name: Detect affected components
    runs-on: ubuntu-latest
    outputs:
      polymarket_bot: ${{ steps.filter.outputs.polymarket_bot }}
      ingester: ${{ steps.filter.outputs.ingester }}
      db_migrate: ${{ steps.filter.outputs.db_migrate }}
      polymarket_bot_tests: ${{ steps.filter.outputs.polymarket_bot_tests }}
      ingester_tests: ${{ steps.filter.outputs.ingester_tests }}
      db_migrate_tests: ${{ steps.filter.outputs.db_migrate_tests }}
      helm_lint: ${{ steps.filter.outputs.helm_lint }}
      helm_chart_sha: ${{ steps.filter.outputs.helm_chart_sha }}
      any_image: ${{ steps.filter.outputs.any_image }}
      image_matrix: ${{ steps.filter.outputs.image_matrix }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Fingerprint component inputs
        id: fingerprints
        shell: bash
        run: |
          set -euo pipefail
          for component in polymarket-bot ingester db-migrate; do
            fingerprint="$(python3 scripts/ci/component-fingerprint.py "$component")"
            echo "${component//-/_}=$fingerprint" >> "$GITHUB_OUTPUT"
          done
      - name: Restore successful polymarket-bot fingerprint
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/ci-fingerprints/polymarket-bot
          key: ci-published-v1-polymarket-bot-${{ steps.fingerprints.outputs.polymarket_bot }}
      - name: Restore successful ingester fingerprint
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/ci-fingerprints/ingester
          key: ci-published-v1-ingester-${{ steps.fingerprints.outputs.ingester }}
      - name: Restore successful db-migrate fingerprint
        uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/ci-fingerprints/db-migrate
          key: ci-published-v1-db-migrate-${{ steps.fingerprints.outputs.db_migrate }}
      - name: Detect affected images
        id: filter
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          BOT_FINGERPRINT: ${{ steps.fingerprints.outputs.polymarket_bot }}
          INGESTER_FINGERPRINT: ${{ steps.fingerprints.outputs.ingester }}
          MIGRATE_FINGERPRINT: ${{ steps.fingerprints.outputs.db_migrate }}
        run: |
          set -euo pipefail
          if [ -z "$BASE_SHA" ] \
            || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            if [ "$GITHUB_REF" = 'refs/heads/development' ]; then
              BASE_SHA="$(git rev-parse "$CURRENT_SHA^")"
            else
              BASE_SHA="$(git merge-base origin/development "$CURRENT_SHA")"
            fi
          fi
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          changed() {
            if git diff --quiet "$BASE_SHA" "$CURRENT_SHA" -- "$@"; then
              echo false
            else
              echo true
            fi
          }
          pending() {
            local component="$1" fingerprint="$2" receipt="$RUNNER_TEMP/ci-fingerprints/$1/published.json"
            if [[ -f "$receipt" ]] && jq -e --arg component "$component" --arg fingerprint "$fingerprint" \
              '.component == $component and .fingerprint == $fingerprint and (.digest | test("^sha256:[0-9a-f]{64}$"))' "$receipt" >/dev/null; then
              echo false
            else
              echo true
            fi
          }
          polymarket_bot="$(pending polymarket-bot "$BOT_FINGERPRINT")"
          ingester="$(pending ingester "$INGESTER_FINGERPRINT")"
          db_migrate="$(pending db-migrate "$MIGRATE_FINGERPRINT")"
          polymarket_bot_tests="$polymarket_bot"
          ingester_tests="$ingester"
          db_migrate_tests="$db_migrate"
          helm_inputs=(
            capitonic-helm-chart
            common/configs/alloy
            common/configs/grafana
            common/configs/loki
            common/configs/pgbouncer
            common/configs/prometheus
            common/scripts/pgbouncer-entrypoint.sh
            scripts/helm/bake-assets.py
          )
          helm_lint="$(changed .github/workflows/CI.yml "${helm_inputs[@]}")"
          helm_chart_sha="$(git ls-files -z -- "${helm_inputs[@]}" \
            | sort -z \
            | xargs -0 sha256sum \
            | sha256sum \
            | cut -d' ' -f1)"
          [[ "$helm_chart_sha" =~ ^[0-9a-f]{64}$ ]]
          image_matrix='[]'
          for component in polymarket-bot ingester db-migrate; do
            case "$component" in
              polymarket-bot)
                affected="$polymarket_bot"
                dockerfile=packages/polymarket-bot/Dockerfile.production
                revision_arg=POLYMARKET_GIT_REVISION
                cache_scope=polymarket-bot-production
                fingerprint="$BOT_FINGERPRINT"
                ;;
              ingester)
                affected="$ingester"
                dockerfile=packages/market-data-ingester/Dockerfile.production
                revision_arg=INGESTER_GIT_REVISION
                cache_scope=ingester-production
                fingerprint="$INGESTER_FINGERPRINT"
                ;;
              db-migrate)
                affected="$db_migrate"
                dockerfile=packages/db-migrate/Dockerfile.production
                revision_arg=DB_MIGRATE_GIT_REVISION
                cache_scope=db-migrate-production
                fingerprint="$MIGRATE_FINGERPRINT"
                ;;
            esac
            if [ "$affected" = true ]; then
              image_matrix="$(jq -cn --argjson matrix "$image_matrix" \
                --arg component "$component" --arg dockerfile "$dockerfile" \
                --arg revision_arg "$revision_arg" --arg cache_scope "$cache_scope" --arg fingerprint "$fingerprint" \
                '$matrix + [{name:$component,dockerfile:$dockerfile,revision_arg:$revision_arg,
                  repository:("capitonic/"+$component),cache_scope:$cache_scope,fingerprint:$fingerprint}]')"
            fi
          done
          {
            echo "polymarket_bot=$polymarket_bot"
            echo "ingester=$ingester"
            echo "db_migrate=$db_migrate"
            echo "polymarket_bot_tests=$polymarket_bot_tests"
            echo "ingester_tests=$ingester_tests"
            echo "db_migrate_tests=$db_migrate_tests"
            echo "helm_lint=$helm_lint"
            echo "helm_chart_sha=$helm_chart_sha"
            echo "image_matrix=$image_matrix"
            if [ "$polymarket_bot" = true ] || [ "$ingester" = true ] || [ "$db_migrate" = true ]; then
              echo "any_image=true"
            else
              echo "any_image=false"
            fi
          } >> "$GITHUB_OUTPUT"

  helm-lint:
    name: Helm chart lint
    needs: [changes, repository-layout]
    if: needs.changes.outputs.helm_lint == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Restore validated chart hash
        id: helm-lint-cache
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/capitonic-helm-lint
          key: helm-lint-v1-${{ runner.os }}-helm-3.18.6-${{ needs.changes.outputs.helm_chart_sha }}-${{ hashFiles('.github/workflows/CI.yml') }}

      - name: Install Helm
        if: steps.helm-lint-cache.outputs.cache-hit != 'true'
        uses: azure/setup-helm@v4
        with:
          version: v3.18.6

      - name: Bake and lint Helm charts
        if: steps.helm-lint-cache.outputs.cache-hit != 'true'
        env:
          HELM_CHART_SHA: ${{ needs.changes.outputs.helm_chart_sha }}
          PROMETHEUS_BASIC_AUTH_USER: ci
        shell: bash
        run: |
          set -euo pipefail
          trap 'python3 scripts/helm/bake-assets.py --clean >/dev/null 2>&1 || true' EXIT
          python3 scripts/helm/bake-assets.py
          for chart in capitonic-helm-chart/charts/*; do
            name="$(basename "$chart")"
            if [[ "$name" == headlamp ]]; then
              helm repo add headlamp https://kubernetes-sigs.github.io/headlamp/ --force-update
              helm dependency build "$chart"
            fi
            values="capitonic-helm-chart/environments/production/$name.yaml"
            extra_values=()
            if [ -f "$values" ]; then
              extra_values=(-f "$values")
            fi
            extra_settings=()
            case "$name" in
              cert-manager-config) extra_settings=(--set-string email=ci@capitonic.invalid) ;;
              cloudflared) extra_settings=(--set-string tunnelId=00000000-0000-0000-0000-000000000000) ;;
            esac
            helm lint "$chart" "${extra_values[@]}" "${extra_settings[@]}"
          done
          argocd_hash_file="$(mktemp)"
          trap 'rm -f "$argocd_hash_file"; python3 scripts/helm/bake-assets.py --clean >/dev/null 2>&1 || true' EXIT
          printf '%s' '$2a$10$.....................................................' > "$argocd_hash_file"
          helm template argocd oci://ghcr.io/argoproj/argo-helm/argo-cd \
            --version 10.9.2 --namespace argocd \
            -f capitonic-helm-chart/environments/production/argocd.yaml \
            --set-file configs.secret.argocdServerAdminPassword="$argocd_hash_file" \
            --set-string configs.secret.argocdServerAdminPasswordMtime=2026-01-01T00:00:00Z \
            > /dev/null
          mkdir -p "$RUNNER_TEMP/capitonic-helm-lint"
          printf '%s\n' "$HELM_CHART_SHA" > "$RUNNER_TEMP/capitonic-helm-lint/validated-sha256"

  rust-tests:
    name: Rust tests
    needs: [changes, repository-layout, helm-lint]
    if: >-
      always() && needs.repository-layout.result == 'success' &&
      (needs.helm-lint.result == 'success' || needs.helm-lint.result == 'skipped') &&
      needs.changes.outputs.polymarket_bot_tests == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      # Keep debug assertions, but avoid large debug symbols and incremental archives.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        run: >-
          rustup toolchain install "$RUST_TOOLCHAIN"
          --profile minimal
          --component rustfmt
          --component clippy

      - name: Cache Cargo downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-downloads-v1-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-polymarket-bot
          restore-keys: |
            cargo-downloads-v1-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            cargo-downloads-v1-${{ runner.os }}-

      - name: Cache polymarket-bot build output
        uses: actions/cache@v5
        with:
          path: target
          key: rust-target-v2-polymarket-bot-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN }}-debug0-incremental0-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'packages/*/Cargo.toml') }}-${{ hashFiles('packages/polymarket-bot/src/**', 'packages/polymarket-bot/tests/**', 'packages/polymarket-bot/build.rs', 'common/proto/**') }}
          restore-keys: |
            rust-target-v2-polymarket-bot-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN }}-debug0-incremental0-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'packages/*/Cargo.toml') }}-

      - name: Check Rust formatting
        run: cargo +"$RUST_TOOLCHAIN" fmt --all -- --check

      - name: Run Clippy
        run: cargo +"$RUST_TOOLCHAIN" clippy --locked --package polymarket-bot --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo +"$RUST_TOOLCHAIN" test --locked --package polymarket-bot --all-targets

      - name: Verify model manifest packaging
        run: PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s packages/polymarket-bot/tests -p 'test_model_packaging.py'

  market-data-ingester-tests:
    name: Market data ingester tests
    needs: [changes, repository-layout, helm-lint]
    if: >-
      always() && needs.repository-layout.result == 'success' &&
      (needs.helm-lint.result == 'success' || needs.helm-lint.result == 'skipped') &&
      needs.changes.outputs.ingester_tests == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    env:
      # Keep debug assertions, but avoid large debug symbols and incremental archives.
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_INCREMENTAL: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        run: >-
          rustup toolchain install "$RUST_TOOLCHAIN"
          --profile minimal
          --component rustfmt
          --component clippy

      - name: Cache Cargo downloads
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-downloads-v1-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-market-data-ingester
          restore-keys: |
            cargo-downloads-v1-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}-
            cargo-downloads-v1-${{ runner.os }}-

      - name: Cache market-data-ingester build output
        uses: actions/cache@v5
        with:
          path: target
          key: rust-target-v2-market-data-ingester-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN }}-debug0-incremental0-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'packages/*/Cargo.toml') }}-${{ hashFiles('packages/market-data-ingester/src/**', 'packages/market-data-ingester/tests/**', 'packages/market-data-ingester/build.rs', 'common/proto/**') }}
          restore-keys: |
            rust-target-v2-market-data-ingester-${{ runner.os }}-${{ runner.arch }}-${{ env.RUST_TOOLCHAIN }}-debug0-incremental0-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'packages/*/Cargo.toml') }}-

      - name: Check Rust formatting
        run: >-
          cargo +"$RUST_TOOLCHAIN" fmt
          --all
          --
          --check

      - name: Run Clippy
        run: >-
          cargo +"$RUST_TOOLCHAIN" clippy
          --locked
          --package market-data-ingester
          --all-targets
          --all-features
          --
          -D warnings
          -A clippy::too_many_arguments

      - name: Run market data ingester tests
        run: >-
          cargo +"$RUST_TOOLCHAIN" test
          --locked
          --package market-data-ingester
          --all-targets
          --all-features

      - name: Build market data ingester documentation
        run: >-
          cargo +"$RUST_TOOLCHAIN" doc
          --locked
          --package market-data-ingester
          --no-deps
          --all-features

  db-migrate-tests:
    name: Database migration package tests
    needs: [changes, repository-layout, helm-lint]
    if: >-
      always() && needs.repository-layout.result == 'success' &&
      (needs.helm-lint.result == 'success' || needs.helm-lint.result == 'skipped') &&
      needs.changes.outputs.db_migrate_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/db-migrate/package-lock.json
      - name: Build and test db-migrate
        run: |
          npm ci --prefix packages/db-migrate
          npm run build --prefix packages/db-migrate
          node --test packages/db-migrate/tests/*.test.js

  production-image-validation:
    name: Build and push ${{ matrix.name }} production image
    if: >-
      always() &&
      github.ref == 'refs/heads/development' &&
      needs.changes.outputs.any_image == 'true' &&
      needs.repository-layout.result == 'success' &&
      (needs.helm-lint.result == 'success' || needs.helm-lint.result == 'skipped') &&
      (needs.rust-tests.result == 'success' || needs.rust-tests.result == 'skipped') &&
      (needs.market-data-ingester-tests.result == 'success' || needs.market-data-ingester-tests.result == 'skipped') &&
      (needs.db-migrate-tests.result == 'success' || needs.db-migrate-tests.result == 'skipped')
    needs: [changes, repository-layout, helm-lint, rust-tests, market-data-ingester-tests, db-migrate-tests]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.image_matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v4
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Log in to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Resolve component image identity
        id: release
        shell: bash
        env:
          COMPONENT: ${{ matrix.name }}
          REPOSITORY: ${{ matrix.repository }}
          FINGERPRINT: ${{ matrix.fingerprint }}
        run: |
          set -euo pipefail
          test_tags="$(git tag --points-at "$GITHUB_SHA" --list "ci/$COMPONENT/v*-test.*")"
          if [[ -n "$test_tags" ]]; then
            [[ "$(wc -l <<< "$test_tags")" -eq 1 ]]
            [[ "$(git cat-file -t "refs/tags/$test_tags")" == tag ]]
            rc_version="${test_tags##*/}"
            [[ "$rc_version" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-test\.(0|[1-9][0-9]*)$ ]]
            source_revision="$GITHUB_SHA"
          else
            source_revision=''
            while IFS= read -r tag; do
              [[ "$(git cat-file -t "refs/tags/$tag")" == tag ]] || continue
              checkpoint="$(git rev-list -n1 "$tag")"
              git merge-base --is-ancestor "$checkpoint" "$GITHUB_SHA" || continue
              annotation="$(git for-each-ref --format='%(contents)' "refs/tags/$tag")"
              candidate="$(awk '$1 == "source_revision:" {print $2}' <<< "$annotation")"
              [[ "$candidate" =~ ^[0-9a-f]{40}$ ]] || continue
              git merge-base --is-ancestor "$candidate" "$checkpoint" || continue
              [[ "$(python3 scripts/ci/component-fingerprint.py "$COMPONENT" "$candidate")" == "$FINGERPRINT" ]] || continue
              source_revision="$candidate"
              rc_version="${tag##*/}"
              break
            done < <(git tag --list "rc/$COMPONENT/v*-rc.*" --sort=-version:refname)
            [[ -n "$source_revision" ]] || { echo "No admitted component tag matches these inputs." >&2; exit 1; }
            [[ "$rc_version" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.(0|[1-9][0-9]*)$ ]]
          fi
          existing_digest="$(aws ecr describe-images --region "$AWS_REGION" --repository-name "$REPOSITORY" \
            --image-ids imageTag="$rc_version" --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)"
          {
            echo "rc_version=$rc_version"
            echo "source_revision=$source_revision"
            echo "existing_rc=$([[ "$existing_digest" =~ ^sha256:[0-9a-f]{64}$ ]] && echo true || echo false)"
            echo "tags<<EOF"
            if [[ ! "$existing_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "$ECR_REGISTRY/$REPOSITORY:$rc_version"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Checkout accepted component source
        if: steps.release.outputs.existing_rc != 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.source_revision }}
          path: build-source
      - name: Build and publish ARM64 image
        if: steps.release.outputs.existing_rc != 'true'
        uses: docker/build-push-action@v7
        with:
          context: build-source
          file: build-source/${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            RUST_VERSION=${{ env.RUST_TOOLCHAIN }}
            ${{ matrix.revision_arg }}=${{ steps.release.outputs.source_revision }}
            ${{ matrix.name == 'polymarket-bot' && 'POLYMARKET_MODEL_PACKAGING=production' || '' }}
          tags: ${{ steps.release.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}-arm64
          cache-to: type=gha,scope=${{ matrix.cache_scope }}-arm64,mode=max
      - name: Verify published ARM64 image and embedded revision
        env:
          COMPONENT: ${{ matrix.name }}
          REPOSITORY: ${{ matrix.repository }}
          RC_VERSION: ${{ steps.release.outputs.rc_version }}
          SOURCE_REVISION: ${{ steps.release.outputs.source_revision }}
          FINGERPRINT: ${{ matrix.fingerprint }}
        run: |
          set -euo pipefail
          digest="$(scripts/production/verify-ecr-arm64-image.sh "$REPOSITORY" "$RC_VERSION" "$SOURCE_REVISION")"
          mkdir -p "$RUNNER_TEMP/ci-fingerprints/$COMPONENT"
          jq -n --arg component "$COMPONENT" --arg fingerprint "$FINGERPRINT" \
            --arg version "$RC_VERSION" --arg revision "$SOURCE_REVISION" --arg digest "$digest" \
            '{component:$component,fingerprint:$fingerprint,version:$version,source_revision:$revision,digest:$digest}' \
            > "$RUNNER_TEMP/ci-fingerprints/$COMPONENT/published.json"
      - name: Record successfully published component fingerprint
        uses: actions/cache/save@v5
        with:
          path: ${{ runner.temp }}/ci-fingerprints/${{ matrix.name }}
          key: ci-published-v1-${{ matrix.name }}-${{ matrix.fingerprint }}
