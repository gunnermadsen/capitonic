name: Verify and Publish Images

on:
  push:
    branches:
      - development
  pull_request:
    branches:
      - development
      - master
      - production
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: capitonic-ci
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.92.0
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-west-1' }}
  AWS_ROLE_ARN: arn:aws:iam::192200846560:role/capitonic-polymarket-bot-github-actions-prod
  ECR_REGISTRY: ${{ vars.ECR_REGISTRY || '192200846560.dkr.ecr.eu-west-1.amazonaws.com' }}

jobs:
  repository-layout:
    name: Repository layout
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Reject vendored Rust crates
        shell: bash
        run: |
          if [ -e vendor ]; then
            echo "Root-level vendor/ is prohibited; declare Rust dependencies in Cargo.toml." >&2
            exit 1
          fi

  changes:
    name: Detect image changes
    runs-on: ubuntu-latest
    outputs:
      polymarket_bot: ${{ steps.filter.outputs.polymarket_bot }}
      ingester: ${{ steps.filter.outputs.ingester }}
      db_migrate: ${{ steps.filter.outputs.db_migrate }}
      any_image: ${{ steps.filter.outputs.any_image }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Configure AWS credentials for accepted RC discovery
        if: github.ref == 'refs/heads/development' && github.event_name != 'pull_request'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Detect affected images
        id: filter
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
            || [ -z "$BASE_SHA" ] \
            || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "polymarket_bot=true" >> "$GITHUB_OUTPUT"
            echo "ingester=true" >> "$GITHUB_OUTPUT"
            echo "db_migrate=true" >> "$GITHUB_OUTPUT"
            echo "any_image=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed_or_missing() {
            local component="$1"
            shift
            if ! git diff --quiet "$BASE_SHA" "$CURRENT_SHA" -- "$@"; then
              echo true
              return
            fi
            if [ "$GITHUB_REF" = 'refs/heads/development' ]; then
              local repository rc_version
              repository="$(jq -er --arg component "$component" '.components[$component].repository' infra/production/release.json)"
              rc_version="$(jq -er --arg component "$component" '.components[$component].rcVersion' infra/production/release.json)"
              if ! aws ecr describe-images --region "$AWS_REGION" --repository-name "$repository" \
                --image-ids imageTag="$rc_version" >/dev/null 2>&1; then
                echo true
                return
              fi
            fi
            echo false
          }
          polymarket_bot="$(changed_or_missing polymarket-bot Cargo.toml Cargo.lock packages/polymarket-bot packages/btc-directional-model/runtime-models common/proto infra/production/release.json)"
          ingester="$(changed_or_missing ingester Cargo.toml Cargo.lock packages/market-data-ingester common/proto infra/production/release.json)"
          db_migrate="$(changed_or_missing db-migrate packages/db-migrate infra/production/release.json)"
          {
            echo "polymarket_bot=$polymarket_bot"
            echo "ingester=$ingester"
            echo "db_migrate=$db_migrate"
            if [ "$polymarket_bot" = true ] || [ "$ingester" = true ] || [ "$db_migrate" = true ]; then
              echo "any_image=true"
            else
              echo "any_image=false"
            fi
          } >> "$GITHUB_OUTPUT"

  rust-tests:
    name: Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        run: >-
          rustup toolchain install "$RUST_TOOLCHAIN"
          --profile minimal
          --component rustfmt
          --component clippy

      - name: Cache Cargo registry and build output
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: polymarket-bot-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            polymarket-bot-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-

      - name: Check Rust formatting
        run: cargo +"$RUST_TOOLCHAIN" fmt --all -- --check

      - name: Run Clippy
        run: cargo +"$RUST_TOOLCHAIN" clippy --locked --package polymarket-bot --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo +"$RUST_TOOLCHAIN" test --locked --package polymarket-bot --all-targets

  market-data-ingester-tests:
    name: Market data ingester tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        run: >-
          rustup toolchain install "$RUST_TOOLCHAIN"
          --profile minimal
          --component rustfmt
          --component clippy

      - name: Cache Cargo registry and ingester build output
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: market-data-ingester-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            market-data-ingester-${{ runner.os }}-${{ env.RUST_TOOLCHAIN }}-

      - name: Check Rust formatting
        run: >-
          cargo +"$RUST_TOOLCHAIN" fmt
          --all
          --
          --check

      - name: Run Clippy
        run: >-
          cargo +"$RUST_TOOLCHAIN" clippy
          --locked
          --package market-data-ingester
          --all-targets
          --all-features
          --
          -D warnings
          -A clippy::too_many_arguments

      - name: Run market data ingester tests
        run: >-
          cargo +"$RUST_TOOLCHAIN" test
          --locked
          --package market-data-ingester
          --all-targets
          --all-features

      - name: Build market data ingester documentation
        run: >-
          cargo +"$RUST_TOOLCHAIN" doc
          --locked
          --package market-data-ingester
          --no-deps
          --all-features

  db-migrate-tests:
    name: Database migration package tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/db-migrate/package-lock.json
      - name: Build and test db-migrate
        run: |
          npm ci --prefix packages/db-migrate
          npm run build --prefix packages/db-migrate
          node --test packages/db-migrate/tests/*.test.js

  outage-recovery-tests:
    name: Outage recovery integration tests
    uses: ./.github/workflows/outage-recovery.yml

  production-image-validation:
    name: Build and push ${{ matrix.name }} production image
    if: github.ref == 'refs/heads/development' && needs.changes.outputs.any_image == 'true'
    needs: [repository-layout, changes, rust-tests, market-data-ingester-tests, db-migrate-tests, outage-recovery-tests]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: polymarket-bot
            dockerfile: packages/polymarket-bot/Dockerfile.production
            revision_arg: POLYMARKET_GIT_REVISION
            repository: capitonic/polymarket-bot
            cache_scope: polymarket-bot-production
            change_key: polymarket_bot
          - name: ingester
            dockerfile: packages/market-data-ingester/Dockerfile.production
            revision_arg: INGESTER_GIT_REVISION
            repository: capitonic/ingester
            cache_scope: ingester-production
            change_key: ingester
          - name: db-migrate
            dockerfile: packages/db-migrate/Dockerfile.production
            revision_arg: DB_MIGRATE_GIT_REVISION
            repository: capitonic/db-migrate
            cache_scope: db-migrate-production
            change_key: db_migrate
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: docker/setup-buildx-action@v4
      - name: Configure AWS credentials
        if: needs.changes.outputs[matrix.change_key] == 'true'
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Log in to Amazon ECR
        if: needs.changes.outputs[matrix.change_key] == 'true'
        uses: aws-actions/amazon-ecr-login@v2
      - name: Resolve accepted semver RC identity
        if: needs.changes.outputs[matrix.change_key] == 'true'
        id: release
        shell: bash
        env:
          COMPONENT: ${{ matrix.name }}
          REPOSITORY: ${{ matrix.repository }}
        run: |
          set -euo pipefail
          rc_version="$(jq -er --arg component "$COMPONENT" '.components[$component].rcVersion' infra/production/release.json)"
          source_revision="$(jq -er --arg component "$COMPONENT" '.components[$component].sourceRevision' infra/production/release.json)"
          [[ "$rc_version" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)-rc\.(0|[1-9][0-9]*)$ ]]
          [[ "$source_revision" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$source_revision" "$GITHUB_SHA"
          rc_git_tag="rc/$COMPONENT/$rc_version"
          [[ "$(git cat-file -t "refs/tags/$rc_git_tag")" == tag ]]
          rc_checkpoint="$(git rev-list -n1 "$rc_git_tag")"
          git merge-base --is-ancestor "$rc_checkpoint" "$GITHUB_SHA"
          accepted_release="$(git show "$rc_checkpoint:infra/production/release.json" | jq -cer --arg component "$COMPONENT" '.components[$component]')"
          current_release="$(jq -cer --arg component "$COMPONENT" '.components[$component]' infra/production/release.json)"
          [[ "$accepted_release" == "$current_release" ]]
          existing_digest="$(aws ecr describe-images --region "$AWS_REGION" --repository-name "$REPOSITORY" \
            --image-ids imageTag="$rc_version" --query 'imageDetails[0].imageDigest' --output text 2>/dev/null || true)"
          {
            echo "rc_version=$rc_version"
            echo "source_revision=$source_revision"
            echo "existing_rc=$([[ "$existing_digest" =~ ^sha256:[0-9a-f]{64}$ ]] && echo true || echo false)"
            echo "tags<<EOF"
            echo "$ECR_REGISTRY/$REPOSITORY:$source_revision"
            if [[ ! "$existing_digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
              echo "$ECR_REGISTRY/$REPOSITORY:$rc_version"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - name: Checkout accepted component source
        if: needs.changes.outputs[matrix.change_key] == 'true' && steps.release.outputs.existing_rc != 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.source_revision }}
          path: build-source
      - name: Build and publish ARM64 image
        if: needs.changes.outputs[matrix.change_key] == 'true' && steps.release.outputs.existing_rc != 'true'
        uses: docker/build-push-action@v7
        with:
          context: build-source
          file: build-source/${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          build-args: |
            RUST_VERSION=${{ env.RUST_TOOLCHAIN }}
            ${{ matrix.revision_arg }}=${{ steps.release.outputs.source_revision }}
          tags: ${{ steps.release.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.cache_scope }}-arm64
          cache-to: type=gha,scope=${{ matrix.cache_scope }}-arm64,mode=max
      - name: Verify published ARM64 image and embedded revision
        if: needs.changes.outputs[matrix.change_key] == 'true'
        env:
          COMPONENT: ${{ matrix.name }}
          REPOSITORY: ${{ matrix.repository }}
          RC_VERSION: ${{ steps.release.outputs.rc_version }}
          SOURCE_REVISION: ${{ steps.release.outputs.source_revision }}
        run: scripts/production/verify-ecr-arm64-image.sh "$REPOSITORY" "$RC_VERSION" "$SOURCE_REVISION" >/dev/null
