name: Refresh Production Kubernetes Secrets

on:
  workflow_call:
    inputs:
      restart_scope:
        required: false
        type: string
        default: all
  workflow_dispatch:
    inputs:
      restart_scope:
        description: Workloads restarted after the atomic Kubernetes secret update
        required: true
        type: choice
        default: all
        options: [all, application, monitoring, none]

permissions:
  contents: read
  actions: write
  id-token: write

concurrency:
  group: capitonic-production
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  AWS_ROLE_ARN: arn:aws:iam::192200846560:role/capitonic-polymarket-bot-github-actions-prod

jobs:
  refresh:
    name: Project Ireland ASM into Kubernetes
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Resolve production revision and host
        id: target
        run: |
          set -euo pipefail
          revision="$(git ls-remote origin refs/heads/production | cut -f1)"
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          instance_id="$(aws ec2 describe-instances --region "$AWS_REGION" \
            --filters Name=tag:Name,Values=capitonic-polymarket-bot Name=tag:Environment,Values=production Name=instance-state-name,Values=running \
            --query 'Reservations[].Instances[].InstanceId' --output text)"
          [ "$(wc -w <<< "$instance_id")" -eq 1 ]
          printf 'revision=%s\ninstance_id=%s\n' "$revision" "$instance_id" >> "$GITHUB_OUTPUT"
      - name: Synchronize and verify secrets
        env:
          INSTANCE_ID: ${{ steps.target.outputs.instance_id }}
          REVISION: ${{ steps.target.outputs.revision }}
          RESTART_SCOPE: ${{ inputs.restart_scope || 'all' }}
        run: |
          set -euo pipefail
          case "$RESTART_SCOPE" in all|application|monitoring|none) ;; *) exit 64 ;; esac
          command="cd /opt/polymarket-bot && scripts/production/checkout-revision.sh $REVISION && RESTART_SCOPE=$RESTART_SCOPE scripts/production/sync-kubernetes-secrets.sh"
          scripts/production/run-ssm-command.sh "$INSTANCE_ID" 1500 'Refresh production Kubernetes secrets from ASM' "$command"
      - name: Admit managed runtime secret changes through CD
        if: inputs.restart_scope != 'none'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run CD.yml --ref production
