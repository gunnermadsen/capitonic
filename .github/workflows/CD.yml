name: Deploy Production

on:
  workflow_call:
    inputs:
      deployment_scope:
        description: Charts explicitly authorized for deployment
        type: string
        default: full-stack
  workflow_dispatch:
    inputs:
      deployment_scope:
        description: Charts explicitly authorized for deployment
        type: choice
        default: bot-grafana
        options: [bot-grafana, full-stack]

permissions:
  contents: write
  id-token: write

concurrency:
  group: capitonic-production
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  AWS_ROLE_ARN: arn:aws:iam::192200846560:role/capitonic-polymarket-bot-github-actions-prod
  ECR_REGISTRY: 192200846560.dkr.ecr.eu-west-1.amazonaws.com

jobs:
  deploy:
    name: Promote, pin, deploy, and verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEPLOYMENT_SCOPE: ${{ inputs.deployment_scope || 'full-stack' }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: production
      - name: Validate explicit deployment scope
        run: |
          case "$DEPLOYMENT_SCOPE" in
            bot-grafana|full-stack) ;;
            *) echo "Unsupported deployment scope: $DEPLOYMENT_SCOPE" >&2; exit 64 ;;
          esac
      - uses: docker/setup-buildx-action@v4
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Install pinned yq
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.47.2/yq_linux_amd64 -o /tmp/yq
          curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.47.2/checksums -o /tmp/yq-checksums
          expected="$(awk '$1 == "yq_linux_amd64" {print $19}' /tmp/yq-checksums)"
          [ -n "$expected" ]
          echo "$expected  /tmp/yq" | sha256sum -c -
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq
      - name: Promote accepted RC digests and write exact Helm pins
        run: scripts/production/promote-production-images.sh
      - name: Commit generated production pins
        id: pins
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [[ "$DEPLOYMENT_SCOPE" == bot-grafana ]]; then
            git add infra/production/release.json capitonic-helm-chart/environments/production/polymarket-bot.yaml capitonic-helm-chart/charts/polymarket-bot/Chart.yaml
          else
            git add infra/production/release.json capitonic-helm-chart/environments/production capitonic-helm-chart/charts/*/Chart.yaml
          fi
          if git diff --cached --quiet; then
            echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            git commit -m 'release: pin promoted production digests [production-pins]'
            git push origin HEAD:production
            echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi
      - name: Resolve the single production node
        id: host
        shell: bash
        run: |
          set -euo pipefail
          instance_id="$(aws ec2 describe-instances --region "$AWS_REGION" \
            --filters Name=tag:Name,Values=capitonic-polymarket-bot Name=tag:Environment,Values=production Name=instance-state-name,Values=running \
            --query 'Reservations[].Instances[].InstanceId' --output text)"
          [ "$(wc -w <<< "$instance_id")" -eq 1 ]
          echo "instance_id=$instance_id" >> "$GITHUB_OUTPUT"
      - name: Deploy exact revision through SSM
        env:
          INSTANCE_ID: ${{ steps.host.outputs.instance_id }}
          DEPLOY_REVISION: ${{ steps.pins.outputs.revision }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_REVISION" =~ ^[0-9a-f]{40}$ ]]
          checkout_payload="$(base64 -w0 scripts/production/checkout-revision.sh)"
          command="install -d -m 0700 /run/capitonic && printf '%s' '$checkout_payload' | base64 -d > /run/capitonic/checkout-revision.sh && chmod 0700 /run/capitonic/checkout-revision.sh && /run/capitonic/checkout-revision.sh $DEPLOY_REVISION && rm -f /run/capitonic/checkout-revision.sh && cd /opt/polymarket-bot && DEPLOYMENT_SCOPE=$DEPLOYMENT_SCOPE scripts/production/deploy-k3s.sh"
          scripts/production/run-ssm-command.sh "$INSTANCE_ID" 3300 'Deploy and verify Capitonic production' "$command"
      - name: Record observability provisioning provenance
        env:
          DEPLOY_REVISION: ${{ steps.pins.outputs.revision }}
        run: |
          set -euo pipefail
          timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
          if [[ "$DEPLOYMENT_SCOPE" == bot-grafana ]]; then
            components=Grafana
            paths='common/configs/grafana; capitonic-helm-chart/charts/grafana; capitonic-helm-chart/environments/production/grafana.yaml'
            config_hash="$(find common/configs/grafana capitonic-helm-chart/charts/grafana capitonic-helm-chart/environments/production/grafana.yaml -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)"
          else
            components='Grafana, Prometheus, Loki, Alloy'
            paths='capitonic-helm-chart/charts/{grafana,prometheus,loki,alloy}; capitonic-helm-chart/environments/production'
            config_hash="$(find capitonic-helm-chart/charts/{grafana,prometheus,loki,alloy} capitonic-helm-chart/environments/production -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)"
          fi
          tag="provisioned/observability/production/$timestamp"
          git tag -a "$tag" "$DEPLOY_REVISION" -m "Target: production
          Provisioned at: $timestamp
          Originating ref: ${GITHUB_REF_NAME:-production}
          Result: success
          Configuration SHA-256: $config_hash
          Components: $components
          Paths: $paths"
          git push origin "refs/tags/$tag"
