name: Deploy Production

on:
  workflow_call:
    inputs:
      full_stack:
        type: boolean
        required: false
        default: false
  workflow_dispatch:
  push:
    branches: [production]

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: capitonic-production
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  AWS_ROLE_ARN: arn:aws:iam::192200846560:role/capitonic-polymarket-bot-github-actions-prod
  ECR_REGISTRY: 192200846560.dkr.ecr.eu-west-1.amazonaws.com

jobs:
  detect:
    name: Detect production components
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.components.outputs.images }}
      charts: ${{ steps.components.outputs.charts }}
      any: ${{ steps.components.outputs.any }}
      baseline: ${{ steps.components.outputs.baseline }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Select release components
        id: components
        env:
          GH_TOKEN: ${{ github.token }}
          FULL_STACK: ${{ inputs.full_stack || false }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            baseline=''
            while read -r run_id revision; do
              if gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/jobs" \
                --jq '[.jobs[] | select(.name == "Promote, pin, deploy, and verify" and .conclusion == "success")] | length' | grep -qx 1; then
                baseline="$revision"
                break
              fi
            done < <(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/CD.yml/runs" \
              -f branch=production -f status=success -f per_page=20 \
              --jq '.workflow_runs[] | [.id,.head_sha] | join(" ")')
          else
            baseline="$(git rev-parse origin/production)"
          fi
          [[ "$baseline" =~ ^[0-9a-f]{40}$ ]]
          echo "baseline=$baseline" >> "$GITHUB_OUTPUT"
          if [[ "$FULL_STACK" == true ]]; then
            echo 'charts=ingester,polymarket-bot,db-migrate,grafana,prometheus,loki,alloy,cloudflared' >> "$GITHUB_OUTPUT"
            echo 'images=' >> "$GITHUB_OUTPUT"
            echo 'any=true' >> "$GITHUB_OUTPUT"
          else
            scripts/production/detect-components.sh "$baseline" "$GITHUB_SHA"
          fi

  validate:
    name: Validate release scope
    needs: detect
    if: needs.detect.result == 'success'
    runs-on: ubuntu-latest
    outputs:
      baseline: ${{ needs.detect.outputs.baseline }}
      deployment_scope: ${{ steps.scope.outputs.deployment_scope }}
      deploy_components: ${{ steps.scope.outputs.deploy_components }}
      promote_components: ${{ steps.scope.outputs.promote_components }}
    env:
      DEPLOYMENT_SCOPE: ${{ inputs.full_stack && 'full-stack' || 'selected' }}
      DEPLOY_COMPONENTS: ${{ needs.detect.outputs.charts }}
      PROMOTE_COMPONENTS: ${{ needs.detect.outputs.images }}
    steps:
      - name: Validate release scope
        id: scope
        run: |
          [[ "$DEPLOYMENT_SCOPE" == full-stack || "$DEPLOYMENT_SCOPE" == selected ]]
          if [[ "$DEPLOYMENT_SCOPE" == selected ]]; then
            [[ "$DEPLOY_COMPONENTS" =~ ^[a-z0-9,-]*$ ]]
            [[ "$PROMOTE_COMPONENTS" =~ ^[a-z0-9,-]*$ ]]
          fi
          {
            echo "deployment_scope=$DEPLOYMENT_SCOPE"
            echo "deploy_components=$DEPLOY_COMPONENTS"
            echo "promote_components=$PROMOTE_COMPONENTS"
          } >> "$GITHUB_OUTPUT"

  pins:
    name: Validate committed release pins
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deployment_scope: ${{ needs.validate.outputs.deployment_scope }}
      deploy_components: ${{ needs.validate.outputs.deploy_components }}
      promote_components: ${{ needs.validate.outputs.promote_components }}
    env:
      DEPLOY_COMPONENTS: ${{ needs.validate.outputs.deploy_components }}
      BASELINE_REVISION: ${{ needs.validate.outputs.baseline }}
      PROMETHEUS_BASIC_AUTH_USER: diagnostic
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Install pinned yq
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.47.2/yq_linux_amd64 -o /tmp/yq
          curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.47.2/checksums -o /tmp/yq-checksums
          expected="$(awk '$1 == "yq_linux_amd64" {print $19}' /tmp/yq-checksums)"
          [ -n "$expected" ]
          echo "$expected  /tmp/yq" | sha256sum -c -
          sudo install -m 0755 /tmp/yq /usr/local/bin/yq
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.6
      - name: Verify pins and render selected charts
        env:
          PIN_REPORT: ${{ runner.temp }}/production-pin-diagnostics/report.md
        run: scripts/production/validate-release-pins.sh
      - name: Preserve diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-pin-diagnostics
          path: ${{ runner.temp }}/production-pin-diagnostics/report.md
          if-no-files-found: warn

  diagnostics:
    name: Log release diagnostics
    needs: pins
    if: always()
    runs-on: ubuntu-latest
    outputs:
      deployment_scope: ${{ needs.pins.outputs.deployment_scope }}
      deploy_components: ${{ needs.pins.outputs.deploy_components }}
      promote_components: ${{ needs.pins.outputs.promote_components }}
    steps:
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: production-pin-diagnostics
          path: ${{ runner.temp }}/production-pin-diagnostics
      - name: Log inspected pins and deployment boundary
        env:
          VALIDATION_RESULT: ${{ needs.pins.result }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/production-pin-diagnostics/report.md"
          if [[ -f "$report" ]]; then
            cat "$report"
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "Pin validation result: $VALIDATION_RESULT; production deployment skipped." | tee -a "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Promote, pin, deploy, and verify
    needs: diagnostics
    # Temporary diagnostic boundary: no entry point can enable production writes.
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DEPLOYMENT_SCOPE: ${{ needs.diagnostics.outputs.deployment_scope }}
      DEPLOY_COMPONENTS: ${{ needs.diagnostics.outputs.deploy_components }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Locate production server
        id: host
        shell: bash
        run: |
          set -euo pipefail
          instance_id="$(aws ec2 describe-instances --region "$AWS_REGION" \
            --filters Name=tag:Name,Values=capitonic-polymarket-bot Name=tag:Environment,Values=production Name=instance-state-name,Values=running \
            --query 'Reservations[].Instances[].InstanceId' --output text)"
          [ "$(wc -w <<< "$instance_id")" -eq 1 ]
          echo "instance_id=$instance_id" >> "$GITHUB_OUTPUT"
      - name: Deploy and verify production release
        env:
          INSTANCE_ID: ${{ steps.host.outputs.instance_id }}
          DEPLOY_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$DEPLOY_REVISION" =~ ^[0-9a-f]{40}$ ]]
          checkout_payload="$(base64 -w0 scripts/production/checkout-revision.sh)"
          command="install -d -m 0700 /run/capitonic && printf '%s' '$checkout_payload' | base64 -d > /run/capitonic/checkout-revision.sh && chmod 0700 /run/capitonic/checkout-revision.sh && /run/capitonic/checkout-revision.sh $DEPLOY_REVISION && rm -f /run/capitonic/checkout-revision.sh && cd /opt/polymarket-bot && DEPLOYMENT_SCOPE=$DEPLOYMENT_SCOPE DEPLOY_COMPONENTS=$DEPLOY_COMPONENTS scripts/production/deploy-k3s.sh"
          scripts/production/run-ssm-command.sh "$INSTANCE_ID" 3300 'Deploy and verify Capitonic production' "$command"
      - name: Record observability provisioning
        env:
          DEPLOY_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
          selected=()
          if [[ "$DEPLOYMENT_SCOPE" == full-stack ]]; then
            selected=(grafana prometheus loki alloy)
          else
            IFS=, read -ra requested <<< "$DEPLOY_COMPONENTS"
            for component in "${requested[@]}"; do
              case "$component" in grafana|prometheus|loki|alloy) selected+=("$component") ;; esac
            done
          fi
          ((${#selected[@]})) || exit 0
          paths=()
          for component in "${selected[@]}"; do
            paths+=("common/configs/$component" "capitonic-helm-chart/charts/$component" "capitonic-helm-chart/environments/production/$component.yaml")
          done
          config_hash="$(find "${paths[@]}" -type f -print0 | sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)"
          components="$(IFS=,; echo "${selected[*]}")"
          path_list="$(IFS=';'; echo "${paths[*]}")"
          tag="provisioned/observability/production/$timestamp"
          git tag -a "$tag" "$DEPLOY_REVISION" -m "Target: production
          Provisioned at: $timestamp
          Originating ref: ${GITHUB_REF_NAME:-production}
          Result: success
          Configuration SHA-256: $config_hash
          Components: $components
          Paths: $path_list"
          git push origin "refs/tags/$tag"
