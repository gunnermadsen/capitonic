name: Provision Complete Production Environment

on:
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  infrastructure:
    name: Provision the single-node runtime
    uses: ./.github/workflows/deploy-production-ec2.yml
    with:
      terraform_action: apply

  secrets:
    name: Bootstrap Kubernetes secrets
    needs: infrastructure
    uses: ./.github/workflows/refresh-production-secrets.yml
    with:
      restart_scope: none

  deployment:
    name: Promote, deploy, and verify the complete stack
    needs: secrets
    uses: ./.github/workflows/CD.yml
