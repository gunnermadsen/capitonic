name: Provision Production k3s Node

on:
  workflow_call:
    inputs:
      terraform_action:
        required: false
        type: string
        default: apply
    outputs:
      instance_id:
        description: Provisioned production EC2 instance ID
        value: ${{ jobs.provision.outputs.instance_id }}
  workflow_dispatch:
    inputs:
      terraform_action:
        description: Plan validates without changing AWS; apply converges the node
        required: true
        type: choice
        default: apply
        options: [plan, apply]

permissions:
  contents: read
  id-token: write

concurrency:
  group: capitonic-production
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  AWS_ROLE_ARN: arn:aws:iam::192200846560:role/capitonic-polymarket-bot-github-actions-prod
  APP_SECRET_NAME: capitonic/polymarket-bot/production
  TF_DIR: infra/production-k3s
  TF_STATE_BUCKET: capitonic-polybot-tfstate-192200846560-euw1
  BACKUP_BUCKET: capitonic-polybot-backups-192200846560-euw1
  TF_IN_AUTOMATION: "true"

jobs:
  provision:
    name: Provision Ireland ARM64 node
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      instance_id: ${{ steps.apply.outputs.instance_id }}
    steps:
      - uses: actions/checkout@v6
      - uses: hashicorp/setup-terraform@v4
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Establish durable Ireland foundation
        run: scripts/production/provision-foundation.sh
      - name: Load Cloudflare inputs from Ireland ASM
        run: scripts/load-cloudflare-terraform-env.sh
      - name: Initialize and validate Terraform
        run: |
          set -euo pipefail
          cat > "$TF_DIR/backend.hcl" <<EOF
          bucket       = "$TF_STATE_BUCKET"
          key          = "production/k3s/terraform.tfstate"
          region       = "$AWS_REGION"
          encrypt      = true
          use_lockfile = true
          EOF
          terraform -chdir="$TF_DIR" init -backend-config=backend.hcl
          terraform -chdir="$TF_DIR" fmt -check -recursive
          terraform -chdir="$TF_DIR" validate
      - name: Import an existing monitor DNS record
        if: inputs.terraform_action != 'plan'
        run: scripts/import-cloudflare-dns-records.sh
      - name: Plan production infrastructure
        run: terraform -chdir="$TF_DIR" plan -input=false -lock-timeout=5m -out=production.tfplan
      - name: Apply production infrastructure
        id: apply
        if: inputs.terraform_action != 'plan'
        run: |
          set -euo pipefail
          terraform -chdir="$TF_DIR" apply -input=false -lock-timeout=5m production.tfplan
          instance_id="$(terraform -chdir="$TF_DIR" output -raw instance_id)"
          [[ "$instance_id" =~ ^i-[0-9a-f]+$ ]]
          echo "instance_id=$instance_id" >> "$GITHUB_OUTPUT"
      - name: Wait for bootstrap contract
        if: inputs.terraform_action != 'plan'
        env:
          INSTANCE_ID: ${{ steps.apply.outputs.instance_id }}
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 900))
          until [[ "$(aws ssm describe-instance-information --region "$AWS_REGION" \
            --filters "Key=InstanceIds,Values=$INSTANCE_ID" \
            --query 'InstanceInformationList[0].PingStatus' --output text)" == "Online" ]]; do
            if (( SECONDS >= deadline )); then
              echo "SSM did not report $INSTANCE_ID online within 15 minutes." >&2
              exit 1
            fi
            sleep 10
          done
          scripts/production/run-ssm-command.sh "$INSTANCE_ID" 1800 'Verify k3s bootstrap' \
            'set -euo pipefail; cloud-init status --wait; test -f /var/lib/capitonic-bootstrap-complete; test "$(uname -m)" = aarch64; systemctl is-active --quiet k3s; kubectl wait --for=condition=Ready node --all --timeout=5m; test "$(kubectl get nodes --no-headers | wc -l)" -eq 1'
          security_group_id="$(terraform -chdir="$TF_DIR" output -raw security_group_id)"
          ingress_rules="$(aws ec2 describe-security-groups --region "$AWS_REGION" \
            --group-ids "$security_group_id" --query 'SecurityGroups[0].IpPermissions' --output json)"
          jq -e '
            length == 1 and
            .[0].IpProtocol == "tcp" and .[0].FromPort == 443 and .[0].ToPort == 443 and
            .[0].Ipv6Ranges == [] and .[0].PrefixListIds == [] and .[0].UserIdGroupPairs == [] and
            ([.[0].IpRanges[].CidrIp] == ["0.0.0.0/0"])
          ' <<<"$ingress_rules" >/dev/null
