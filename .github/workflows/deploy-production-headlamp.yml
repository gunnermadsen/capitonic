name: Deploy Production Headlamp

on:
  workflow_call:
    inputs:
      revision:
        description: Committed revision to provision
        required: false
        type: string
        default: production
  workflow_dispatch:
    inputs:
      revision:
        description: Committed revision to provision
        required: false
        type: string
        default: production

permissions:
  contents: read
  id-token: write

concurrency:
  group: capitonic-production-headlamp
  cancel-in-progress: false

env:
  AWS_REGION: eu-west-1
  AWS_ROLE_ARN: arn:aws:iam::192200846560:role/capitonic-polymarket-bot-github-actions-prod

jobs:
  deploy:
    name: Install and verify Headlamp on the production node
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.revision || 'production' }}
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Resolve production node
        id: host
        run: |
          set -euo pipefail
          instance_id="$(aws ec2 describe-instances --region "$AWS_REGION" \
            --filters Name=tag:Name,Values=capitonic-polymarket-bot Name=tag:Environment,Values=production Name=instance-state-name,Values=running \
            --query 'Reservations[].Instances[].InstanceId' --output text)"
          [ "$(wc -w <<< "$instance_id")" -eq 1 ]
          echo "instance_id=$instance_id" >> "$GITHUB_OUTPUT"
      - name: Install at the committed production revision
        env:
          INSTANCE_ID: ${{ steps.host.outputs.instance_id }}
        run: |
          set -euo pipefail
          revision="$(git rev-parse HEAD)"
          checkout_payload="$(base64 -w0 scripts/production/checkout-revision.sh)"
          command="install -d -m 0700 /run/capitonic && printf '%s' '$checkout_payload' | base64 -d > /run/capitonic/checkout-revision.sh && chmod 0700 /run/capitonic/checkout-revision.sh && /run/capitonic/checkout-revision.sh $revision && rm -f /run/capitonic/checkout-revision.sh && cd /opt/polymarket-bot && scripts/production/deploy-headlamp.sh"
          scripts/production/run-ssm-command.sh "$INSTANCE_ID" 1800 'Install and verify production Headlamp' "$command"
