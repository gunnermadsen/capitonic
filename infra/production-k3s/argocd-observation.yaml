apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: capitonic-production-observe
  namespace: argocd
spec:
  sourceRepos:
    - https://github.com/gunnermadsen/capitonic.git
    - https://charts.external-secrets.io
  destinations:
    - namespace: capitonic
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: ""
      kind: PersistentVolume
      name: capitonic-ingester-archives
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: polymarket-bot
  namespace: argocd
spec:
  project: capitonic-production-observe
  source:
    repoURL: https://github.com/gunnermadsen/capitonic.git
    targetRevision: production
    path: capitonic-helm-chart/charts/polymarket-bot
    helm:
      releaseName: polymarket-bot
      valueFiles:
        - ../../environments/production/polymarket-bot.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: capitonic
  syncPolicy:
    automated: {prune: false, selfHeal: true}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ingester
  namespace: argocd
spec:
  project: capitonic-production-observe
  source:
    repoURL: https://github.com/gunnermadsen/capitonic.git
    targetRevision: production
    path: capitonic-helm-chart/charts/ingester
    helm:
      releaseName: ingester
      valueFiles:
        - ../../environments/production/ingester.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: capitonic
  syncPolicy:
    automated: {prune: false, selfHeal: true}

---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: capitonic-secret-operator
  namespace: argocd
spec:
  sourceRepos: [https://charts.external-secrets.io, https://github.com/gunnermadsen/capitonic.git]
  destinations:
    - {namespace: external-secrets, server: https://kubernetes.default.svc}
    - {namespace: capitonic, server: https://kubernetes.default.svc}
  clusterResourceWhitelist:
    - {group: apiextensions.k8s.io, kind: CustomResourceDefinition}
    - {group: admissionregistration.k8s.io, kind: ValidatingWebhookConfiguration}
    - {group: rbac.authorization.k8s.io, kind: ClusterRole}
    - {group: rbac.authorization.k8s.io, kind: ClusterRoleBinding}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: capitonic-secret-operator
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 2.11.0
      helm:
        releaseName: external-secrets
        valueFiles: [$values/capitonic-helm-chart/environments/production/external-secrets.yaml]
    - repoURL: https://github.com/gunnermadsen/capitonic.git
      targetRevision: production
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated: {prune: false, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
