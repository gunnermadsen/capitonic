apiVersion: 1

groups:
  - orgId: 1
    name: live-execution-health-30s
    folder: Polymarket Trading Path
    interval: 30s
    rules:
      - uid: live_fill_read_latency
        title: Live fill read latency is sustained above budget
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 900, to: 0}
            model: {datasource: {type: prometheus, uid: prometheus}, editorMode: code, expr: "histogram_quantile(0.95, sum by (operation, site, le) (rate(polymarket_live_fill_read_duration_seconds_bucket{result!=\"error\"}[10m]))) and on (operation, site) (sum by (operation, site) (increase(polymarket_live_fill_read_duration_seconds_count{result!=\"error\"}[10m])) >= 30)", instant: true, refId: A}
          - refId: B
            datasourceUid: __expr__
            model: {datasource: {type: __expr__, uid: __expr__}, expression: A, reducer: last, type: reduce, refId: B}
          - refId: C
            datasourceUid: __expr__
            model: {datasource: {type: __expr__, uid: __expr__}, expression: B, type: threshold, conditions: [{evaluator: {params: [0.05], type: gt}, operator: {type: and}, query: {params: [C]}, reducer: {params: [], type: last}}], refId: C}
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations: {summary: "Live fill read p95 exceeds 50 ms under sustained activity", description: "Client-observed store read latency includes pool wait, SQL execution, transfer, and decoding. This alert requires a Prometheus estimate of at least 30 completed non-error reads at one operation and site in ten minutes; it does not measure database CPU or assert execution failure."}
        labels: {service: polymarket-bot, family: live_execution, severity: warning, environment: $GRAFANA_ALERT_ENVIRONMENT}
        isPaused: false
      - uid: live_execution_decision_post_latency
        title: Decision-to-POST latency is excessive
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 900, to: 0}
            model: {datasource: {type: prometheus, uid: prometheus}, editorMode: code, expr: "histogram_quantile(0.95, sum by (process_id, le) (rate(polymarket_umr_stage_duration_seconds_bucket{stage=\"decision_to_venue_post\"}[10m])))", instant: true, refId: A}
          - refId: B
            datasourceUid: __expr__
            model: {datasource: {type: __expr__, uid: __expr__}, expression: A, reducer: last, type: reduce, refId: B}
          - refId: C
            datasourceUid: __expr__
            model: {datasource: {type: __expr__, uid: __expr__}, expression: B, type: threshold, conditions: [{evaluator: {params: [1], type: gt}, operator: {type: and}, query: {params: [C]}, reducer: {params: [], type: last}}], refId: C}
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations: {summary: "Qualified decisions are taking too long to reach the venue POST", description: "The process-scoped p95 decision-to-POST latency exceeded one second for five minutes."}
        labels: {service: polymarket-bot, family: live_execution, severity: warning, environment: $GRAFANA_ALERT_ENVIRONMENT}
        isPaused: false
      - uid: live_execution_decision_ack_latency
        title: Decision-to-acknowledgement latency is excessive
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 900, to: 0}
            model: {datasource: {type: prometheus, uid: prometheus}, editorMode: code, expr: "histogram_quantile(0.95, sum by (process_id, le) (rate(polymarket_umr_stage_duration_seconds_bucket{stage=\"decision_to_venue_acknowledgement\"}[10m])))", instant: true, refId: A}
          - refId: B
            datasourceUid: __expr__
            model: {datasource: {type: __expr__, uid: __expr__}, expression: A, reducer: last, type: reduce, refId: B}
          - refId: C
            datasourceUid: __expr__
            model: {datasource: {type: __expr__, uid: __expr__}, expression: B, type: threshold, conditions: [{evaluator: {params: [2], type: gt}, operator: {type: and}, query: {params: [C]}, reducer: {params: [], type: last}}], refId: C}
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations: {summary: "Live orders are slow to reach venue acknowledgement", description: "The process-scoped p95 decision-to-acknowledgement latency exceeded two seconds for five minutes."}
        labels: {service: polymarket-bot, family: live_execution, severity: warning, environment: $GRAFANA_ALERT_ENVIRONMENT}
        isPaused: false
      - uid: live_execution_transport_failure
        title: Live submissions are failing in transport
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 600, to: 0}
            model: {datasource: {type: prometheus, uid: prometheus}, editorMode: code, expr: "sum by (process_id) (increase(polymarket_umr_venue_post_outcomes_total{reason=\"transport_failure\"}[5m]))", instant: true, refId: A}
          - refId: B
            datasourceUid: __expr__
            model: {datasource: {type: __expr__, uid: __expr__}, expression: A, reducer: last, type: reduce, refId: B}
          - refId: C
            datasourceUid: __expr__
            model: {datasource: {type: __expr__, uid: __expr__}, expression: B, type: threshold, conditions: [{evaluator: {params: [0], type: gt}, operator: {type: and}, query: {params: [C]}, reducer: {params: [], type: last}}], refId: C}
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations: {summary: "A live order encountered a venue transport failure", description: "The submission is durably marked ambiguous and must be resolved by WebSocket or HTTP reconciliation before intervention."}
        labels: {service: polymarket-bot, family: live_execution, severity: critical, environment: $GRAFANA_ALERT_ENVIRONMENT}
        isPaused: false
      - uid: live_execution_qualified_without_post
        title: Qualified decisions repeatedly fail to reach a venue POST
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 900, to: 0}
            model: {datasource: {type: prometheus, uid: prometheus}, editorMode: code, expr: "sum by (process_id, reason) (increase(polymarket_umr_qualified_without_post_total[10m]))", instant: true, refId: A}
          - refId: B
            datasourceUid: __expr__
            model: {datasource: {type: __expr__, uid: __expr__}, expression: A, reducer: last, type: reduce, refId: B}
          - refId: C
            datasourceUid: __expr__
            model: {datasource: {type: __expr__, uid: __expr__}, expression: B, type: threshold, conditions: [{evaluator: {params: [3], type: gt}, operator: {type: and}, query: {params: [C]}, reducer: {params: [], type: last}}], refId: C}
        noDataState: OK
        execErrState: Error
        for: 3m
        annotations: {summary: "Qualified decisions are repeatedly failing before venue submission", description: "This is execution opportunity loss, not proof of a missed fill. Inspect the bounded reason label and entry-safety evidence."}
        labels: {service: polymarket-bot, family: live_execution, severity: warning, environment: $GRAFANA_ALERT_ENVIRONMENT}
        isPaused: false
      - uid: live_execution_candidate_lag
        title: Scheduled candidate evaluation lag is excessive
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 900, to: 0}
            model: {datasource: {type: prometheus, uid: prometheus}, editorMode: code, expr: "histogram_quantile(0.95, sum by (process_id, le) (rate(polymarket_umr_stage_duration_seconds_bucket{stage=\"scheduled_candidate_evaluation_lag\"}[10m])))", instant: true, refId: A}
          - refId: B
            datasourceUid: __expr__
            model: {datasource: {type: __expr__, uid: __expr__}, expression: A, reducer: last, type: reduce, refId: B}
          - refId: C
            datasourceUid: __expr__
            model: {datasource: {type: __expr__, uid: __expr__}, expression: B, type: threshold, conditions: [{evaluator: {params: [1], type: gt}, operator: {type: and}, query: {params: [C]}, reducer: {params: [], type: last}}], refId: C}
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations: {summary: "Scheduled candidates are evaluated more than one second late", description: "Sustained evaluation lag can consume market-data freshness and execution opportunity budgets."}
        labels: {service: polymarket-bot, family: live_execution, severity: warning, environment: $GRAFANA_ALERT_ENVIRONMENT}
        isPaused: false
      - uid: live_daily_loss_evidence_unavailable
        title: Live daily-loss evidence is unavailable
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 600, to: 0}
            model: {datasource: {type: prometheus, uid: prometheus}, editorMode: code, expr: "sum by (process_id, reason) (increase(polymarket_umr_live_submission_risk_checks_total{outcome=\"evidence_error\",reason=\"daily_loss_evidence_unavailable\"}[5m]))", instant: true, refId: A}
          - refId: B
            datasourceUid: __expr__
            model: {datasource: {type: __expr__, uid: __expr__}, expression: A, reducer: last, type: reduce, refId: B}
          - refId: C
            datasourceUid: __expr__
            model: {datasource: {type: __expr__, uid: __expr__}, expression: B, type: threshold, conditions: [{evaluator: {params: [0], type: gt}, operator: {type: and}, query: {params: [C]}, reducer: {params: [], type: last}}], refId: C}
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations: {summary: "A qualified live order was blocked by invalid daily-loss evidence", description: "The order did not reach Polymarket. Inspect the process-scoped settlement lineage and daily-loss metrics; pending redemption alone must not cause this failure."}
        labels: {service: polymarket-bot, family: live_execution, severity: critical, environment: $GRAFANA_ALERT_ENVIRONMENT}
        isPaused: false
      - uid: live_submission_reconcile_conflict
        title: Live submission evidence contradicts reconciliation health
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 600, to: 0}
            model: {datasource: {type: prometheus, uid: prometheus}, editorMode: code, expr: "(1 - polymarket_umr_live_submission_risk_evidence_ready) and on(process_id) (time() - polymarket_umr_live_submission_risk_last_check_timestamp_seconds < 300) and on(process_id) (polymarket_live_reconciliation_entry_safe == 1)", instant: true, refId: A}
          - refId: B
            datasourceUid: __expr__
            model: {datasource: {type: __expr__, uid: __expr__}, expression: A, reducer: last, type: reduce, refId: B}
          - refId: C
            datasourceUid: __expr__
            model: {datasource: {type: __expr__, uid: __expr__}, expression: B, type: threshold, conditions: [{evaluator: {params: [0], type: gt}, operator: {type: and}, query: {params: [C]}, reducer: {params: [], type: last}}], refId: C}
        noDataState: OK
        execErrState: Error
        for: 1m
        annotations: {summary: "Reconciliation is clean but qualified live submission evidence is unavailable", description: "The last five minutes contain a live pre-submit evidence failure while process accounting reconciliation remains entry-safe."}
        labels: {service: polymarket-bot, family: live_execution, severity: critical, environment: $GRAFANA_ALERT_ENVIRONMENT}
        isPaused: false
      - uid: live_capital_evidence_unavailable
        title: Live capital admission evidence is unavailable
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 600, to: 0}
            model: {datasource: {type: prometheus, uid: prometheus}, editorMode: code, expr: "sum by (process_id, reason) (increase(polymarket_umr_live_submission_risk_checks_total{outcome=\"evidence_error\",reason=~\"account_identity_evidence_unavailable|exposure_evidence_unavailable|account_order_evidence_unavailable|collateral_evidence_unavailable\"}[5m]))", instant: true, refId: A}
          - refId: B
            datasourceUid: __expr__
            model: {datasource: {type: __expr__, uid: __expr__}, expression: A, reducer: last, type: reduce, refId: B}
          - refId: C
            datasourceUid: __expr__
            model: {datasource: {type: __expr__, uid: __expr__}, expression: B, type: threshold, conditions: [{evaluator: {params: [0], type: gt}, operator: {type: and}, query: {params: [C]}, reducer: {params: [], type: last}}], refId: C}
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations: {summary: "A qualified live order could not prove capital admission", description: "The order was safely withheld before Polymarket POST. The bounded reason identifies identity, exposure, account-order, or collateral evidence."}
        labels: {service: polymarket-bot, family: live_execution, severity: warning, environment: $GRAFANA_ALERT_ENVIRONMENT}
        isPaused: false
      - uid: live_execution_preview_capacity
        title: Stress preview capacity is unavailable
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 900, to: 0}
            model: {datasource: {type: prometheus, uid: prometheus}, editorMode: code, expr: "sum by (process_id) (increase(polymarket_umr_stress_preview_outcomes_total{reason=~\"capacity_unavailable|persistence_error\"}[10m]))", instant: true, refId: A}
          - refId: B
            datasourceUid: __expr__
            model: {datasource: {type: __expr__, uid: __expr__}, expression: A, reducer: last, type: reduce, refId: B}
          - refId: C
            datasourceUid: __expr__
            model: {datasource: {type: __expr__, uid: __expr__}, expression: B, type: threshold, conditions: [{evaluator: {params: [0], type: gt}, operator: {type: and}, query: {params: [C]}, reducer: {params: [], type: last}}], refId: C}
        noDataState: OK
        execErrState: Error
        for: 2m
        annotations: {summary: "Non-mutating stress-preview evidence is incomplete", description: "Preview work remains isolated from primary execution, but capacity or persistence prevented complete preview evidence."}
        labels: {service: polymarket-bot, family: live_execution, severity: warning, environment: $GRAFANA_ALERT_ENVIRONMENT}
        isPaused: false
      - uid: live_order_path_unclassified_exit
        title: Live order path exited without a terminal classification
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 600, to: 0}
            model: {datasource: {type: prometheus, uid: prometheus}, editorMode: code, expr: "sum by (process_id) (increase(polymarket_live_order_path_terminal_outcomes_total{outcome=\"error\",reason=\"unclassified_exit\"}[5m]))", instant: true, refId: A}
          - refId: B
            datasourceUid: __expr__
            model: {datasource: {type: __expr__, uid: __expr__}, expression: A, reducer: last, type: reduce, refId: B}
          - refId: C
            datasourceUid: __expr__
            model: {datasource: {type: __expr__, uid: __expr__}, expression: B, type: threshold, conditions: [{evaluator: {params: [0], type: gt}, operator: {type: and}, query: {params: [C]}, reducer: {params: [], type: last}}], refId: C}
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations: {summary: "A live order path ended without a bounded outcome", description: "The qualified order did not produce an explicit acknowledgement, venue rejection, local rejection, ambiguity, or deduplication outcome. Correlate the process-scoped Loki terminal event and durable order record."}
        labels: {service: polymarket-bot, family: live_execution, severity: critical, environment: $GRAFANA_ALERT_ENVIRONMENT}
        isPaused: false
      - uid: live_order_path_stuck
        title: Live order path remains in flight
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 300, to: 0}
            model: {datasource: {type: prometheus, uid: prometheus}, editorMode: code, expr: "min_over_time(polymarket_live_order_path_in_flight[2m])", instant: true, refId: A}
          - refId: B
            datasourceUid: __expr__
            model: {datasource: {type: __expr__, uid: __expr__}, expression: A, reducer: last, type: reduce, refId: B}
          - refId: C
            datasourceUid: __expr__
            model: {datasource: {type: __expr__, uid: __expr__}, expression: B, type: threshold, conditions: [{evaluator: {params: [0], type: gt}, operator: {type: and}, query: {params: [C]}, reducer: {params: [], type: last}}], refId: C}
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations: {summary: "A live order invocation has remained in flight for two minutes", description: "Inspect the Internal Live Order Stage Latency and Live Order Execution Funnel panels to identify the last completed stage. Observability does not cancel or block the order."}
        labels: {service: polymarket-bot, family: live_execution, severity: critical, environment: $GRAFANA_ALERT_ENVIRONMENT}
        isPaused: false
      - uid: approved_live_decision_no_order
        title: Approved live decision has no order outcome
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 300, to: 0}
            model: {datasource: {type: prometheus, uid: prometheus}, editorMode: code, expr: "polymarket_umr_approved_live_decisions_without_order_result", instant: true, refId: A}
          - refId: B
            datasourceUid: __expr__
            model: {datasource: {type: __expr__, uid: __expr__}, expression: A, reducer: last, type: reduce, refId: B}
          - refId: C
            datasourceUid: __expr__
            model: {datasource: {type: __expr__, uid: __expr__}, expression: B, type: threshold, conditions: [{evaluator: {params: [0], type: gt}, operator: {type: and}, query: {params: [C]}, reducer: {params: [], type: last}}], refId: C}
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations: {summary: "An approved live decision exceeded its execution deadline without a durable order result", description: "Inspect the process-scoped decision and order-plan identifiers in Loki and btc_strategy_decisions."}
        labels: {service: polymarket-bot, family: live_execution, severity: critical, environment: $GRAFANA_ALERT_ENVIRONMENT}
        isPaused: false
      - uid: unresolved_submit_unknown_age
        title: Unknown live submission remains unresolved
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 600, to: 0}
            model: {datasource: {type: prometheus, uid: prometheus}, editorMode: code, expr: "polymarket_live_submit_unknown_oldest_age_seconds", instant: true, refId: A}
          - refId: B
            datasourceUid: __expr__
            model: {datasource: {type: __expr__, uid: __expr__}, expression: A, reducer: last, type: reduce, refId: B}
          - refId: C
            datasourceUid: __expr__
            model: {datasource: {type: __expr__, uid: __expr__}, expression: B, type: threshold, conditions: [{evaluator: {params: [90], type: gt}, operator: {type: and}, query: {params: [C]}, reducer: {params: [], type: last}}], refId: C}
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations: {summary: "A submit_unknown order exceeded the reconciliation threshold", description: "New entries remain blocked only for the affected process while automatic reconciliation continues."}
        labels: {service: polymarket-bot, family: live_execution, severity: critical, environment: $GRAFANA_ALERT_ENVIRONMENT}
        isPaused: false
      - uid: live_order_path_beyond_deadline
        title: Live order path exceeded its operation deadline
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 300, to: 0}
            model: {datasource: {type: prometheus, uid: prometheus}, editorMode: code, expr: "polymarket_live_order_path_in_flight > 0 and on(process_id) (time() - polymarket_live_order_path_last_activity_timestamp_seconds > 10)", instant: true, refId: A}
          - refId: B
            datasourceUid: __expr__
            model: {datasource: {type: __expr__, uid: __expr__}, expression: A, reducer: last, type: reduce, refId: B}
          - refId: C
            datasourceUid: __expr__
            model: {datasource: {type: __expr__, uid: __expr__}, expression: B, type: threshold, conditions: [{evaluator: {params: [0], type: gt}, operator: {type: and}, query: {params: [C]}, reducer: {params: [], type: last}}], refId: C}
        noDataState: OK
        execErrState: Error
        for: 30s
        annotations: {summary: "A live order path remains active beyond its configured operation deadline", description: "Inspect CLOB stage timeout and submission-lock metrics for the affected process."}
        labels: {service: polymarket-bot, family: live_execution, severity: critical, environment: $GRAFANA_ALERT_ENVIRONMENT}
        isPaused: false
      - uid: runtime_terminated_transport
        title: Trading runtime terminated after transport failure
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 600, to: 0}
            model: {datasource: {type: prometheus, uid: prometheus}, editorMode: code, expr: "sum by (process_id) (increase(polymarket_live_transport_runtime_outcomes_total{outcome=\"terminated\"}[5m]))", instant: true, refId: A}
          - refId: B
            datasourceUid: __expr__
            model: {datasource: {type: __expr__, uid: __expr__}, expression: A, reducer: last, type: reduce, refId: B}
          - refId: C
            datasourceUid: __expr__
            model: {datasource: {type: __expr__, uid: __expr__}, expression: B, type: threshold, conditions: [{evaluator: {params: [0], type: gt}, operator: {type: and}, query: {params: [C]}, reducer: {params: [], type: last}}], refId: C}
        noDataState: OK
        execErrState: Error
        for: 0s
        annotations: {summary: "A transport-class execution error unexpectedly terminated a trading process", description: "Ordinary CLOB timeouts and connection failures must preserve durable process intent."}
        labels: {service: polymarket-bot, family: live_execution, severity: critical, environment: $GRAFANA_ALERT_ENVIRONMENT}
        isPaused: false
      - uid: sustained_clob_timeout_or_lock_wait
        title: Sustained CLOB timeouts or submission lock wait
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 900, to: 0}
            model: {datasource: {type: prometheus, uid: prometheus}, editorMode: code, expr: "sum by (process_id) (rate(polymarket_live_clob_operation_timeouts_total[10m])) or histogram_quantile(0.95, sum by (process_id, le) (rate(polymarket_live_submission_guard_wait_seconds_bucket[10m])))", instant: true, refId: A}
          - refId: B
            datasourceUid: __expr__
            model: {datasource: {type: __expr__, uid: __expr__}, expression: A, reducer: last, type: reduce, refId: B}
          - refId: C
            datasourceUid: __expr__
            model: {datasource: {type: __expr__, uid: __expr__}, expression: B, type: threshold, conditions: [{evaluator: {params: [0.05], type: gt}, operator: {type: and}, query: {params: [C]}, reducer: {params: [], type: last}}], refId: C}
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations: {summary: "CLOB operations or submission ownership are persistently delayed", description: "Inspect bounded stage labels and p95 submission-lock wait before latency consumes market freshness."}
        labels: {service: polymarket-bot, family: live_execution, severity: warning, environment: $GRAFANA_ALERT_ENVIRONMENT}
        isPaused: false
