apiVersion: 1

groups:
  - orgId: 1
    name: polymarket-bot-availability-20s
    folder: Trading Services
    interval: 20s
    rules:
      - uid: polymarket_bot_target_unavailable
        title: Polymarket bot target unavailable
        condition: C
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: {from: 60, to: 0}
            model:
              datasource: {type: prometheus, uid: prometheus}
              editorMode: code
              expr: 'up{job="polymarket-bot"} == 0 or absent(up{job="polymarket-bot"})'
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: B
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              reducer: last
              refId: B
              settings: {mode: dropNN}
              type: reduce
          - refId: C
            datasourceUid: __expr__
            relativeTimeRange: {from: 0, to: 0}
            model:
              datasource: {type: __expr__, uid: __expr__}
              expression: B
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
              conditions:
                - evaluator: {params: [0], type: gt}
                  operator: {type: and}
                  query: {params: [C]}
                  reducer: {params: [], type: last}
                  type: query
        noDataState: Alerting
        execErrState: Error
        for: 2m
        annotations:
          description: The Kubernetes bot metrics target is missing or unreachable. This alert does not change trading-process intent.
          summary: Polymarket bot metrics are unavailable
        labels: {environment: dev, family: availability, service: polymarket-bot, severity: warning}
        isPaused: false
