          "noDataState": "OK",
          "execErrState": "Error",
          "for": "2m",
          "annotations": {
            "summary": "UMR agent eligible markets without predictions",
            "description": "At least three inference requests were attempted without a valid prediction. Check provider failure reasons and data readiness.",
            "dashboardUid": "unified-model-runtime"
          },
          "labels": {
            "family": "umr",
            "service": "polymarket-bot",
            "severity": "warning",
            "environment": "$GRAFANA_ALERT_ENVIRONMENT"
          },
