{
  "apiVersion": 1,
  "groups": [
    {
      "orgId": 1,
      "name": "unified-model-runtime-agent",
      "folder": "Unified Model Runtime",
      "interval": "30s",
      "rules": [
        {
          "uid": "umr_agent_invalid_response",
          "title": "UMR agent repeated invalid responses",
          "condition": "C",
          "data": [
            {"refId":"A","datasourceUid":"prometheus","relativeTimeRange":{"from":900,"to":0},"model":{"datasource":{"type":"prometheus","uid":"prometheus"},"editorMode":"code","expr":"sum by (process_id) (increase(polymarket_umr_agent_requests_total{reason=\"invalid_response\"}[15m])) >= bool 3","instant":true,"range":false,"refId":"A","intervalMs":1000,"maxDataPoints":43200}},
            {"refId":"B","datasourceUid":"__expr__","relativeTimeRange":{"from":0,"to":0},"model":{"datasource":{"type":"__expr__","uid":"__expr__"},"expression":"A","reducer":"last","settings":{"mode":"dropNN"},"type":"reduce","refId":"B"}},
            {"refId":"C","datasourceUid":"__expr__","relativeTimeRange":{"from":0,"to":0},"model":{"datasource":{"type":"__expr__","uid":"__expr__"},"expression":"B","type":"threshold","refId":"C","conditions":[{"evaluator":{"params":[0],"type":"gt"},"operator":{"type":"and"},"query":{"params":["C"]},"reducer":{"params":[],"type":"last"},"type":"query"}]}}
          ],
          "noDataState":"OK","execErrState":"Error","for":"1m",
          "annotations":{"summary":"Repeated agent invalid responses","description":"At least three invalid responses in 15 minutes. Inspect the agent response-failure breakdown and process diagnostics logs for umr_agent_response_failed; correlate request_id with saved decision metadata. This alert does not disable trading.","dashboardUid":"unified-model-runtime"},
          "labels":{"family":"umr","service":"polymarket-bot","severity":"warning","environment":"$GRAFANA_ALERT_ENVIRONMENT"},
          "isPaused":false
        },
        {
          "uid": "umr_agent_authentication",
          "title": "UMR agent subscription authentication failing",
          "condition": "C",
          "data": [
            {
              "refId": "A",
              "datasourceUid": "prometheus",
              "relativeTimeRange": {
                "from": 900,
                "to": 0
              },
              "model": {
                "datasource": {
                  "type": "prometheus",
                  "uid": "prometheus"
                },
                "editorMode": "code",
                "expr": "sum by (process_id) (increase(polymarket_umr_agent_requests_total{reason=\"authentication\"}[10m])) > bool 0",
                "instant": true,
                "range": false,
                "refId": "A",
                "intervalMs": 1000,
                "maxDataPoints": 43200
              }
            },
            {
              "refId": "B",
              "datasourceUid": "__expr__",
              "relativeTimeRange": {
                "from": 0,
                "to": 0
              },
              "model": {
                "datasource": {
                  "type": "__expr__",
                  "uid": "__expr__"
                },
                "expression": "A",
                "reducer": "last",
                "settings": {
                  "mode": "dropNN"
                },
                "type": "reduce",
                "refId": "B"
              }
            },
            {
              "refId": "C",
              "datasourceUid": "__expr__",
              "relativeTimeRange": {
                "from": 0,
                "to": 0
              },
              "model": {
                "datasource": {
                  "type": "__expr__",
                  "uid": "__expr__"
                },
                "expression": "B",
                "type": "threshold",
                "refId": "C",
                "conditions": [
                  {
                    "evaluator": {
                      "params": [
                        0
                      ],
                      "type": "gt"
                    },
                    "operator": {
                      "type": "and"
                    },
                    "query": {
                      "params": [
                        "C"
                      ]
                    },
                    "reducer": {
                      "params": [],
                      "type": "last"
                    },
                    "type": "query"
                  }
                ]
              }
            }
          ],
          "noDataState": "OK",
          "execErrState": "Error",
          "for": "1m",
          "annotations": {
            "summary": "UMR agent subscription authentication failing",
            "description": "Subscription authorization or refresh is unavailable. Existing processes are unaffected.",
            "dashboardUid": "unified-model-runtime"
          },
          "labels": {
            "family": "umr",
            "service": "polymarket-bot",
            "severity": "warning",
            "environment": "$GRAFANA_ALERT_ENVIRONMENT"
          },
          "isPaused": false
        },
        {
