apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    basicAuth: true
    basicAuthUser: ${PROMETHEUS_BASIC_AUTH_USER}
    secureJsonData:
      basicAuthPassword: ${PROMETHEUS_BASIC_AUTH_PASSWORD}
    jsonData:
      httpMethod: POST
      timeInterval: 20s
    editable: false
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    editable: false
  - name: Postgres
    type: postgres
    uid: postgres
    access: proxy
    url: pgbouncer:6432
    user: capitonic_grafana
    editable: false
    jsonData:
      database: polymarket_observe_tx
      sslmode: disable
      postgresVersion: 1400
      timescaledb: true
      maxOpenConns: 2
      maxIdleConns: 1
      maxIdleConnsAuto: false
      connMaxLifetime: 14400
    secureJsonData:
      password: ${GRAFANA_POSTGRES_PASSWORD}
  - name: Polymarket Bot Runtime
    type: yesoreyeram-infinity-datasource
    uid: polymarket-bot-runtime
    access: proxy
    editable: false
    jsonData:
      auth_method: bearerToken
      allowedHosts:
        - http://polymarket-bot:8097
      timeoutInSeconds: 2
      allowDangerousHTTPMethods: false
    secureJsonData:
      bearerToken: ${POLYMARKET_HTTP_ADMIN_TOKEN}
